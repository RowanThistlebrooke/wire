<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap">
<style>
  body { background:#0e1113; color:#e8e4dc; font:600 16px/1.5 "Manrope",system-ui,sans-serif; margin:0;
         display:grid; place-items:center; min-height:100vh; padding:24px; }
  form { width:100%; max-width:320px; display:grid; gap:12px; }
  h1 { font-size:20px; font-weight:800; margin:0 0 8px; }
  input, button { font:inherit; padding:12px; border-radius:8px; border:1px solid #252d33; }
  input { background:#151a1d; color:#e8e4dc; }
  button { background:#e8e4dc; color:#0e1113; border:0; font-weight:800; }
  p { color:#d1584a; min-height:1.5em; margin:0; }
</style>

<form id="f">
  <h1>wire</h1>
  <input id="email" type="email" placeholder="email" required>
  <input id="pw" type="password" placeholder="password" required>
  <button>sign in</button>
  <p id="msg"></p>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/api/config.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);

db.auth.getSession().then(({ data }) => {
  if (data.session) location.href = 'you.html';
});

f.onsubmit = async (e) => {
  e.preventDefault();
  msg.textContent = '';
  const { error } = await db.auth.signInWithPassword({
    email: email.value,
    password: pw.value
  });
  if (error) msg.textContent = error.message;
  else location.href = 'you.html';
};
</script>
