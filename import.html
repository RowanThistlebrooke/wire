<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>import</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* the face skin, same tokens as you.html. same import underneath. */
:root{--ground:#050607;--surface:#0a0d0f;--edge:#1e262b;--edge2:#2c363d;--ink:#e8e4dc;--dim:#9ba4a7;--muted:#6e777b;
 --teal:#4bb5a6;--amber:#e3a33f;--leak:#c05a4c;
 --ui:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font-family:var(--mono)}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a{color:inherit;text-decoration:none}
.lab{font:700 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.err{font:12px/1.6 var(--mono);color:var(--leak);margin-top:14px}

.main{padding:18px 28px 90px;max-width:860px}
.t{font:800 clamp(24px,2.6vw,32px)/1 var(--ui);letter-spacing:-.04em;margin-top:14px}
.m{font:12px/1.7 var(--mono);color:var(--muted);margin-top:10px;min-height:1.7em}.m b{color:var(--dim);font-weight:400}

/* the door */
#drop{display:block;width:100%;margin-top:18px;background:none;border:1px dashed var(--edge2);border-radius:6px;padding:34px 22px;font:13px/1.8 var(--mono);color:var(--muted);cursor:pointer}
#drop:hover,#drop.over{border-color:var(--teal);color:var(--ink)}

/* what the file holds */
.from{display:flex;gap:14px;align-items:baseline;margin-top:28px}
.from input{width:160px;background:none;border:0;border-bottom:2px solid var(--edge);color:var(--ink);font:800 20px/1.3 var(--ui);letter-spacing:-.02em;padding:4px 0;outline:0;min-width:0}
.from input:focus{border-bottom-color:var(--teal)}
.axis,.r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center}
.axis{margin-top:24px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
.r{padding:9px 0;border-top:1px solid var(--edge);cursor:pointer}
.r:first-child{border-top:0}
.r input{appearance:none;-webkit-appearance:none;width:14px;height:14px;margin:0;border:1px solid var(--edge2);border-radius:3px;cursor:pointer}
.r input:checked{background:var(--teal);border-color:var(--teal)}
.r .nm{font:800 14px/1.2 var(--ui);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .col{font:400 11px/1 var(--mono);letter-spacing:0;color:var(--muted);margin-left:10px}
.r .rt{font:11px/1 var(--mono);color:var(--muted);white-space:nowrap}.r .rt b{color:var(--ink);font-weight:700}
.r:hover .nm{color:var(--teal)}
.r:has(input:not(:checked)) .nm,.r:has(input:not(:checked)) .rt b{color:var(--muted)}

/* write it */
.go{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--edge)}
.bt{background:none;border:1px solid var(--edge2);color:var(--ink);font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:12px 16px;border-radius:5px;cursor:pointer}
.bt:hover{border-color:var(--teal);color:var(--teal)}
.bt[disabled]{opacity:.4;cursor:default;border-color:var(--edge2);color:var(--ink)}
.st{font:12px/1.4 var(--mono);color:var(--muted)}
.done{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:30px}
.done .now{font:800 clamp(36px,4vw,56px)/.85 var(--ui);letter-spacing:-.04em;color:var(--teal)}
.done .now.zero{color:var(--muted)}
.done .w{font:700 12px/1 var(--mono);color:var(--dim);padding-bottom:6px}

/* tabs: the other pages */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;background:var(--ground);border-top:1px solid var(--edge);padding:0 28px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:block;border-top:2px solid transparent;color:var(--muted);font:800 11px/1 var(--ui);letter-spacing:.02em;text-transform:uppercase;padding:12px 11px 13px;white-space:nowrap}
.tabs a:hover{color:var(--dim)}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
@media (max-width:820px){.main{padding:20px 16px 120px}.tabs{padding:0 8px}.tabs a{font-size:11px;padding:14px 9px}}
</style>

<div class="main">
  <div class="lab">csv &#183; file drop</div>
  <div class="t">Import.</div>
  <div class="m" id="meta"></div>
  <button id="drop">drop a csv</button>
  <input id="file" type="file" accept=".csv,text/csv" hidden>
  <div id="found"></div>
  <div id="msg"></div>
</div>

<nav class="tabs" aria-label="pages">
  <a href="you.html">you</a>
  <a href="pad.html">pad</a>
  <a href="import.html" aria-current="page">import</a>
  <a href="commit.html">commit</a>
  <a href="test.html">test</a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
let PLAN = null;

// --- csv, handling quoted fields ---
function parseCSV(text) {
  const rows = [[]];
  let field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { rows[rows.length - 1].push(field); field = ''; }
    else if (c === '\n') { rows[rows.length - 1].push(field); field = ''; rows.push([]); }
    else if (c !== '\r') field += c;
  }
  rows[rows.length - 1].push(field);
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || '';
const isDate = v => v.trim() !== '' && !isNaN(Date.parse(v));
const isNum  = v => v.trim() !== '' && !isNaN(Number(v));

// --- work out what this file is ---
function plan(rows, filename) {
  if (rows.length < 2) return { error: 'no rows' };
  const head = rows[0].map(h => h.trim());
  const body = rows.slice(1);

  let dateCol = -1, best = 0;
  head.forEach((_, c) => {
    const hits = body.filter(r => isDate(r[c] || '')).length;
    const nums = body.filter(r => isNum(r[c] || '')).length;
    // a column of plain numbers is not a date column
    if (hits > best && hits > nums) { best = hits; dateCol = c; }
  });
  if (dateCol === -1) return { error: 'no date column' };

  const metrics = [];
  head.forEach((h, c) => {
    if (c === dateCol || !slug(h)) return;
    const nums = body.filter(r => isNum(r[c] || '')).length;
    if (nums >= body.length * 0.6) metrics.push({
      col: c, name: slug(h), label: h, on: true,
      // the readings that will actually land: a date and a number on the same row
      n: body.filter(r => isDate(r[dateCol] || '') && isNum(r[c] || '')).length
    });
  });
  if (!metrics.length) return { error: 'no number columns' };

  const guess = slug(filename.replace(/\.csv$/i, '')).split('_')[0];
  return { head, body, dateCol, metrics, filename, guess };
}

function draw(p) {
  $('meta').innerHTML = `<b>${esc(p.filename)}</b> &#183; dates <b>${esc(p.head[p.dateCol])}</b> &#183; <b>${p.body.length}</b> rows`;
  $('found').innerHTML = `
    <label class="from"><span class="lab">from</span>
      <input id="src" value="${esc(p.guess)}" placeholder="yt" autocomplete="off" spellcheck="false">
    </label>
    <div class="axis"><span></span><span class="lab">metric</span><span class="lab">readings</span></div>
    <div id="names"></div>
    <div class="go"><button class="bt" id="go"></button><span class="st" id="st"></span></div>`;
  $('src').oninput = names;
  $('names').onchange = e => { PLAN.metrics[+e.target.dataset.i].on = e.target.checked; count(); };
  $('go').onclick = run;
  names();
}

// One word. Every metric in the file gets it as a prefix.
function names() {
  const pre = slug($('src').value);
  $('names').innerHTML = PLAN.metrics.map((m, i) =>
    `<label class="r">
      <input type="checkbox" data-i="${i}" ${m.on ? 'checked' : ''}>
      <span class="nm">${pre ? pre + '_' : ''}${m.name}<span class="col">${esc(m.label)}</span></span>
      <span class="rt"><b>${m.n}</b></span>
    </label>`).join('');
  count();
}

function chosen() {
  const pre = slug($('src').value);
  return PLAN.metrics.filter(m => m.on).map(m => ({ ...m, name: pre ? pre + '_' + m.name : m.name }));
}

function count() {
  const n = chosen().reduce((a, m) => a + m.n, 0);
  $('go').innerHTML = `import ${n}`;
  $('go').disabled = !n;
}

function readings(metrics) {
  const rows = [];
  for (const [ri, r] of PLAN.body.entries()) {
    const raw = r[PLAN.dateCol];
    if (!isDate(raw || '')) continue;
    const when = new Date(raw).toISOString();
    for (const m of metrics) {
      const v = r[m.col];
      if (!isNum(v || '')) continue;
      rows.push({
        occurred_at: when,
        metric: m.name,
        value: Number(v),
        source: 'csv',
        source_id: `${PLAN.filename}:${ri}:${raw}`
      });
    }
  }
  return rows;
}

// Ask the database what this file already put in, so the same file twice lands once.
// It reads page by page, because one read stops at the project's row cap and a
// row it never saw would land a second time. A _ or % in the filename only
// widens the match, and the exact check is the Set.
async function already(filename) {
  const seen = new Set();
  for (let from = 0; ;) {
    const { data, error } = await db.from('events')
      .select('source_id, metric')
      .eq('source', 'csv')
      .like('source_id', filename + ':%')
      .order('source_id').order('metric')
      .range(from, from + 999);
    if (error) throw error;
    if (!data.length) return seen;
    data.forEach(h => seen.add(h.source_id + '|' + h.metric));
    from += data.length;
  }
}

async function run() {
  const go = $('go'), st = $('st');
  go.disabled = true; $('msg').innerHTML = ''; st.textContent = 'reading';
  const rows = readings(chosen());

  // If the check fails, nothing is written. A guess here would double the file.
  let seen;
  try { seen = await already(PLAN.filename); }
  catch (e) { st.textContent = ''; go.disabled = false; return say(e.message || String(e)); }
  const fresh = rows.filter(r => !seen.has(r.source_id + '|' + r.metric));

  for (let i = 0; i < fresh.length; i += 500) {
    const { error } = await db.from('events').insert(fresh.slice(i, i + 500));
    if (error) { st.textContent = ''; go.disabled = false; return say(`${error.message} · ${i} added before it stopped`); }
    st.textContent = `${Math.min(i + 500, fresh.length)} / ${fresh.length}`;
  }

  st.textContent = '';
  go.disabled = false;
  $('msg').innerHTML = `<div class="done"><span class="now${fresh.length ? '' : ' zero'}">${fresh.length}</span><span class="w">added &#183; ${rows.length - fresh.length} already in</span></div>`;
}

function say(m) { $('msg').innerHTML = `<p class="err">${esc(m)}</p>`; }

function load(f) {
  const r = new FileReader();
  r.onload = () => {
    const p = plan(parseCSV(r.result), f.name);
    $('msg').innerHTML = '';
    if (p.error) { PLAN = null; $('meta').innerHTML = ''; $('found').innerHTML = ''; return say(p.error); }
    PLAN = p; draw(p);
  };
  r.readAsText(f);
}

const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
file.onchange = () => { if (file.files[0]) load(file.files[0]); file.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
};

db.auth.getSession().then(({ data }) => { if (!data.session) location.href = 'index.html'; });
</script>
