<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>import</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap">
<style>
/* the file door. drop a csv, every number column becomes a metric. the same file twice lands once. */
:root{--ground:#070809;--edge:#171c20;--edge2:#232a30;--ink:#e6e3dc;--dim:#8d959a;--muted:#5c656b;
 --teal:#c9a25a;--amber:#c9a25a;--leak:#c9695c;
 --ui:"Manrope","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font:600 14px/1.5 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font-family:var(--mono)}
button:focus-visible,input:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
a{color:inherit;text-decoration:none}

.main{max-width:640px;margin:0 auto;padding:22px 24px 110px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:0}
.out{background:none;border:0;color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0}
.out:hover{color:var(--ink)}
.lab{font:600 9.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

#drop{margin-top:34px;border:1px solid var(--edge2);padding:44px 16px;text-align:center;color:var(--muted);font:500 18px/1.4 var(--ui);cursor:pointer}
#drop.over{border-color:var(--teal);color:var(--ink)}
#drop b{display:block;font:600 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;margin-top:10px}

.n{font:600 11px/1.6 var(--mono);color:var(--muted);letter-spacing:.04em;margin:26px 0 0}
.n b{color:var(--dim);font-weight:600}
.pre{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end;margin-top:22px}
.pre input{background:none;border:0;border-bottom:1px solid var(--edge2);color:var(--ink);font:500 22px/1.2 var(--ui);padding:6px 0;width:100%;min-width:0;border-radius:0}
.pre input:focus{border-bottom-color:var(--teal);outline:0}
#names{margin-top:18px;border-top:1px solid var(--edge)}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge);cursor:pointer}
.row input{accent-color:var(--teal);margin:0;width:14px;height:14px}
.row .nm{font:600 15px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{font:600 11px/1 var(--mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
#go{margin-top:22px;width:100%;background:none;border:1px solid var(--edge2);color:var(--ink);font:600 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:15px 0;cursor:pointer}
#go:hover{border-color:var(--teal);color:var(--teal)}
#go[disabled]{opacity:.35;cursor:default}
.msg{font:600 11px/1.6 var(--mono);color:var(--muted);margin:12px 0 0;min-height:1.6em;letter-spacing:.04em}
.msg.bad{color:var(--leak)}
.msg.good{color:var(--teal)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;background:var(--ground);border-top:1px solid var(--edge);padding:0 24px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:block;border-top:1px solid transparent;color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:13px 12px 14px;white-space:nowrap}
.tabs a:hover{color:var(--dim)}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--teal)}
@media (max-width:640px){.main{padding:18px 16px 110px}}
</style>

<div class="main">
  <div class="bar">
    <p class="eyebrow">import &#183; a file you have</p>
    <button class="out" id="out" type="button">sign out</button>
  </div>

  <div id="drop">drop a csv<b>or click</b>
    <input id="file" type="file" accept=".csv,text/csv" hidden>
  </div>

  <div id="found"></div>
  <button id="go" hidden>import</button>
  <p class="msg" id="msg"></p>
</div>

<nav class="tabs" aria-label="pages">
  <a href="you.html">you</a>
  <a href="pad.html">pad</a>
  <a href="import.html" aria-current="page">import</a>
  <a href="commit.html">commit</a>
  <a href="test.html">test</a>
  <a href="scan.html">scan</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/api/config.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
let PLAN = null;

// --- csv, handling quoted fields ---
function parseCSV(text) {
  const rows = [[]];
  let field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { rows[rows.length - 1].push(field); field = ''; }
    else if (c === '\n') { rows[rows.length - 1].push(field); field = ''; rows.push([]); }
    else if (c !== '\r') field += c;
  }
  rows[rows.length - 1].push(field);
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'metric';
const isDate = v => v.trim() !== '' && !isNaN(Date.parse(v));
const isNum  = v => v.trim() !== '' && !isNaN(Number(v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- work out what this file is ---
function plan(rows, filename) {
  const head = rows[0].map(h => h.trim());
  const body = rows.slice(1);

  let dateCol = -1, best = 0;
  head.forEach((_, c) => {
    const hits = body.filter(r => isDate(r[c] || '')).length;
    const nums = body.filter(r => isNum(r[c] || '')).length;
    // a column of plain numbers is not a date column
    if (hits > best && hits > nums) { best = hits; dateCol = c; }
  });
  if (dateCol === -1) return { error: 'No date column found.' };

  const metrics = [];
  head.forEach((h, c) => {
    if (c === dateCol) return;
    const nums = body.filter(r => isNum(r[c] || '')).length;
    if (nums >= body.length * 0.6) metrics.push({ col: c, name: slug(h), label: h, n: nums });
  });
  if (!metrics.length) return { error: 'No number columns found.' };

  const guess = slug(filename.replace(/\.csv$/i, '')).split('_')[0];
  return { head, body, dateCol, metrics, filename, guess };
}

function draw(p) {
  found.innerHTML = `
    <p class="n">${esc(p.filename)} &#183; dates from <b>${esc(p.head[p.dateCol])}</b> &#183; <b>${p.body.length}</b> rows</p>
    <label class="pre"><span class="lab">prefix</span>
      <input type="text" id="src" value="${esc(p.guess)}" placeholder="yt" autocomplete="off" spellcheck="false">
    </label>
    <div id="names"></div>`;
  src.oninput = names;
  names();
  go.hidden = false;
}

// One word. Every metric in the file gets it as a prefix.
function names() {
  const pre = slug(src.value);
  document.getElementById('names').innerHTML = PLAN.metrics.map((m, i) =>
    `<label class="row">
      <input type="checkbox" data-i="${i}" checked>
      <span class="nm">${esc(pre ? pre + '_' : '')}${esc(m.name)}</span>
      <span class="k">${m.n}</span>
    </label>`).join('');
}

function load(file) {
  const r = new FileReader();
  r.onload = () => {
    const p = plan(parseCSV(r.result), file.name);
    if (p.error) { msg.className = 'msg bad'; msg.textContent = p.error; return; }
    PLAN = p; msg.textContent = ''; draw(p);
  };
  r.readAsText(file);
}

drop.onclick = () => file.click();
file.onchange = e => e.target.files[0] && load(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
};

go.onclick = async () => {
  go.disabled = true;
  msg.className = 'msg'; msg.textContent = 'reading';

  const pre = slug(src.value);
  const chosen = [...found.querySelectorAll('input[type=checkbox]')]
    .filter(c => c.checked)
    .map(c => {
      const m = PLAN.metrics[+c.dataset.i];
      return { ...m, name: pre ? pre + '_' + m.name : m.name };
    });

  const rows = [];
  for (const [ri, r] of PLAN.body.entries()) {
    const raw = r[PLAN.dateCol];
    if (!isDate(raw || '')) continue;
    const when = new Date(raw).toISOString();
    for (const m of chosen) {
      const v = r[m.col];
      if (!isNum(v || '')) continue;
      rows.push({
        occurred_at: when,
        metric: m.name,
        value: Number(v),
        source: 'csv',
        source_id: `${PLAN.filename}:${ri}:${raw}`
      });
    }
  }

  // Ask the database what it already has, so the same file twice lands once.
  const { data: have } = await db.from('events')
    .select('source_id, metric').eq('source', 'csv');
  const seen = new Set((have || []).map(h => h.source_id + '|' + h.metric));
  const fresh = rows.filter(r => !seen.has(r.source_id + '|' + r.metric));

  if (!fresh.length) {
    msg.className = 'msg good';
    msg.textContent = `nothing new · all ${rows.length} readings are already in`;
    go.disabled = false; return;
  }

  for (let i = 0; i < fresh.length; i += 500) {
    const { error } = await db.from('events').insert(fresh.slice(i, i + 500));
    if (error) { msg.className = 'msg bad'; msg.textContent = error.message; go.disabled = false; return; }
    msg.textContent = `${Math.min(i + 500, fresh.length)} / ${fresh.length}`;
  }

  msg.className = 'msg good';
  msg.textContent = `${fresh.length} added · ${rows.length - fresh.length} already there`;
  go.disabled = false;
};

document.getElementById('out').onclick = async () => { await db.auth.signOut(); location.href = 'index.html'; };
db.auth.getSession().then(({ data }) => { if (!data.session) location.href = 'index.html'; });
</script>
