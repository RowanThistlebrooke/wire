<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>did it work</title>
<style>
  body { background:#0e1113; color:#e8e4dc; font:16px/1.5 system-ui; margin:0;
         padding:24px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .n { color:#69737a; font-size:13px; margin:0 0 20px; }
  .pick { display:grid; gap:8px; margin-bottom:20px; }
  select { font:inherit; padding:12px; border-radius:8px; border:1px solid #252d33;
           background:#151a1d; color:#e8e4dc; width:100%; }
  .card { border:1px solid #252d33; border-radius:10px; padding:18px; }
  .verdict { font:700 22px/1.2 system-ui; margin-bottom:10px; letter-spacing:-.01em; }
  .finding { color:#4bb5a6; } .tangled { color:#d9a441; }
  .none, .thin { color:#69737a; }
  .why { color:#9ba4aa; font-size:14px; margin:0 0 14px; }
  .nums { display:flex; gap:22px; flex-wrap:wrap; border-top:1px solid #1b2227;
          padding-top:14px; }
  .num { display:flex; flex-direction:column; gap:3px; }
  .num b { font:700 17px/1 system-ui; font-variant-numeric:tabular-nums; }
  .num span { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#69737a; }
  .foot { margin-top:28px; display:flex; gap:16px; }
  a { color:#69737a; font-size:13px; }
  .err { color:#d1584a; font-size:13px; }
</style>

<h1>did it work</h1>
<p class="n">Pick one thing you did and one thing you measure. It compares the days it ran against the same number of days straight before.</p>

<div class="pick">
  <select id="c"></select>
  <select id="m"></select>
</div>

<div id="out"></div>

<div class="foot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="nav.js" defer></script>
<script src="you-reader.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
let COMMITS = [], SERIES = {}, YOU = [];

const TITLE = {
  finding:      'It worked',
  tangled:      'Cannot say',
  'no finding': 'No finding',
  early:        'Too early to call',
  'no before':  'Nothing to compare'
};
const CLASS = {
  finding: 'finding', tangled: 'tangled',
  'no finding': 'none', early: 'thin', 'no before': 'thin'
};

function show() {
  const commit = COMMITS.find(x => x.id === c.value);
  const points = m.value === 'YOU' ? YOU : (SERIES[m.value] || []);
  if (!commit || !points.length) { out.innerHTML = ''; return; }

  const today = new Date().toISOString().slice(0, 10);
  const r = testCommit(points, commit, COMMITS, today);

  const num = (v, l) => `<div class="num"><b>${v}</b><span>${l}</span></div>`;
  out.innerHTML = `<div class="card">
    <div class="verdict ${CLASS[r.verdict]}">${TITLE[r.verdict]}</div>
    <p class="why">${r.why}</p>
    <div class="nums">
      ${r.beforeMean !== null ? num(r.beforeMean, `before · ${r.before} days`) : ''}
      ${r.duringMean !== null ? num(r.duringMean, `during · ${r.during} days`) : ''}
      ${r.effect !== undefined ? num((r.effect > 0 ? '+' : '') + r.effect, 'change') : ''}
      ${r.bar !== undefined ? num(r.bar, 'the bar') : ''}
    </div>
  </div>`;
}

(async () => {
  const { data: s } = await db.auth.getSession();
  if (!s.session) { location.href = 'index.html'; return; }

  const [all, rules, commits] = await Promise.all(
    [readMetrics(db), readRules(db), readCommits(db)]);
  const rows = await readDays(db, all);

  COMMITS = commits;
  SERIES = rankSeries(rows, rules);
  YOU = etfSeries(SERIES, Object.keys(SERIES));

  if (!COMMITS.length) {
    out.innerHTML = '<p class="err">No commits yet. Log one first.</p>';
    return;
  }

  c.innerHTML = COMMITS.map(x => `<option value="${x.id}">${x.name}</option>`).join('');
  m.innerHTML = ['YOU', ...Object.keys(SERIES)]
    .map(k => `<option value="${k}">${k}</option>`).join('');
  c.onchange = show; m.onchange = show;
  show();
})();
</script>
