<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--ground:#070809;--panel:#0c0f11;--edge:#171c20;--edge2:#232a30;--ink:#e6e3dc;--dim:#8d959a;--muted:#5c656b;
 --teal:#5fc4b4;--amber:#c9a25a;--leak:#c9695c;
 --ui:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--mono)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
.pos{color:var(--teal)}.neg{color:var(--leak)}

/* the page: goals on the left, the goal in the middle */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.main{width:100%;max-width:940px;margin:0 auto;padding-block:20px 90px;padding-inline:clamp(16px,4vw,44px);min-width:0}

/* goals, listed like stocks */
.rail{border-right:1px solid var(--edge);position:sticky;top:0;height:100vh;overflow-y:auto;padding-top:56px}
.gr{display:grid;grid-template-columns:minmax(0,1fr) 60px 64px;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--edge);padding:17px 18px 17px 22px;color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 2px 0 transparent;transition:background .18s}
.gr:hover{background:#0b0e10}
.gr.on{background:#0f1417;box-shadow:inset 2px 0 var(--amber)}
.gr .nm{font:400 14px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr.on .nm{color:var(--amber)}
.gr svg{width:60px;height:24px;display:block}
.gr .v{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font:400 13px/1 var(--mono)}
.gr .v em{font-style:normal;font-size:10px;color:var(--muted)}
.gr .v em.pos{color:var(--teal)}.gr .v em.neg{color:var(--leak)}
.gr.add{display:block;color:var(--muted);font:300 20px/1 var(--ui);padding:14px 22px}
.gr.add:hover{color:var(--ink)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.eyebrow{font:11px/1 var(--mono);letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{background:none;border:0;color:var(--muted);font:11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0}
.out:hover{color:var(--ink)}

/* the number */
.head{display:flex;align-items:flex-end;gap:18px;margin-top:22px}
.big{font:300 80px/.86 var(--ui);letter-spacing:-.035em}
.hs{display:flex;flex-direction:column;gap:7px;padding-bottom:4px;font:400 13px/1 var(--mono)}
.hs span{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.tg{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font:400 12px/1.4 var(--mono);color:var(--dim)}
.tg:empty{display:none}
.tg b{font-weight:400;color:var(--ink)}
.tg b.pos{color:var(--teal)}.tg b.neg{color:var(--leak)}

/* what is counted: where each reading comes from, which stocks it feeds, and the goal they make */
.flow{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:clamp(26px,7vw,84px);align-items:center;margin-top:30px;padding:4px 0}
.flow:empty{display:none}
.wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke:#222a30;stroke-width:1}
.wires path.live{stroke:var(--teal);stroke-opacity:.6;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:.5 8;animation:flow 1.6s linear infinite}
.wires path.off{stroke:#1d2328;stroke-dasharray:3 4}
.wires path.weak{stroke:var(--leak);stroke-opacity:.55}
.wires path.weak.live{stroke:var(--leak)}
.wires path.on{stroke:var(--ink);stroke-opacity:.55}
@keyframes flow{to{stroke-dashoffset:-17}}
.flow .col{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.flow .col.src{align-items:flex-end}
.flow .col.ms{align-items:flex-start}
.node{background:var(--ground);border:1px solid transparent;color:var(--muted);font:400 10.5px/1 var(--mono);letter-spacing:.06em;padding:6px 8px;text-align:left;max-width:100%}
.node.s{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.node.m{display:inline-flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .18s,background .18s}
.node.m .nm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.node.m b{font:300 15px/1 var(--ui);color:var(--ink);white-space:nowrap}
.node.m b small{font:400 9px/1 var(--mono);color:var(--muted);margin-left:3px}
.node.m i{font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--muted)}
.node.m .gl svg{width:9px;height:9px;display:block}
.node.m.off .nm,.node.m.off b{color:var(--muted)}
.node.m.weak .nm{color:var(--leak)}
.node.m:hover{border-color:var(--edge)}
.node.m.on{border-color:var(--edge2);background:#0f1417}
.node.g{display:flex;flex-direction:column;gap:7px;cursor:pointer;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);padding:11px 14px;border-color:var(--edge2)}
.node.g b{font:300 26px/1 var(--ui);letter-spacing:-.01em;color:var(--ink)}
.node.g b.pos{color:var(--teal)}.node.g b.neg{color:var(--leak)}
/* past six stocks: a row per source */
.flow.grouped{row-gap:12px}
.flow.grouped > .node.s{grid-column:1;justify-self:end}
.flow .grp{grid-column:2;justify-self:start;display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;max-width:100%;position:relative;border-left:1px solid var(--edge2);padding-left:8px}
.flow .grp .node.m{padding:5px 7px}
.flow.grouped > .col.gl{grid-column:3;align-self:center}
@media (max-width:520px){.flow .grp .node.m small,.flow .grp .node.m i{display:none}.flow.grouped .node.g{padding:9px 10px}.flow.grouped .node.g b{font-size:20px}}

/* a stock's rule, when the stock is picked */
.rules{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.rules:empty{display:none}
.rules button{background:none;border:1px solid var(--edge2);color:var(--muted);font:400 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:9px 11px;cursor:pointer}
.rules button:hover{color:var(--ink);border-color:var(--dim)}
.rules button[aria-pressed="true"]{color:var(--teal);border-color:var(--teal)}
.rules input{width:84px;background:none;border:0;border-bottom:1px solid var(--edge2);color:var(--ink);font:300 18px/1.2 var(--ui);padding:4px 0;margin-left:8px;border-radius:0}
.rules input:focus{border-bottom-color:var(--teal);outline:0}

/* the chart */
.chart{margin-top:26px;position:relative}
#c{display:block;width:100%;touch-action:pan-y;cursor:crosshair}
#c .ln{fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}
#c.still .ln{animation:none;stroke-dashoffset:0}
#c .ln.moving{stroke-opacity:.45}
@keyframes draw{to{stroke-dashoffset:0}}
#c .area{opacity:0;animation:fadein .9s ease .35s forwards}
#c.still .area{animation:none;opacity:1}
@keyframes fadein{to{opacity:1}}
#c .base{stroke:#2a353c;stroke-dasharray:2 5}
#c text{font:400 9px var(--mono);fill:var(--muted);letter-spacing:.06em}
#c text.tag{font-size:10.5px}
#c text.eff{font:300 30px var(--ui);letter-spacing:-.02em}
#c .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.3);opacity:.45}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){#c .ln,#c .area,#c .pulse,.wires path.live{animation:none}#c .ln{stroke-dashoffset:0}#c .area{opacity:1}}
.ranges{display:flex;gap:2px;justify-content:flex-end;margin-top:6px}
.ranges button{background:none;border:0;color:var(--muted);font:400 10px/1 var(--mono);letter-spacing:.14em;padding:9px 10px;cursor:pointer}
.ranges button:hover{color:var(--ink)}
.ranges button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -1px var(--ink)}

/* levers against outcomes, on YOU: a table per goal that names levers */
.cross{overflow-x:auto;margin-top:22px;border-top:1px solid var(--edge)}
.cross:empty{display:none}
.cross table{border-collapse:collapse;min-width:100%;margin-top:16px}
.cross caption{caption-side:top;text-align:left;font:400 9.5px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);padding:0 0 2px}
.cross th{font:400 9.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right;vertical-align:bottom;padding:10px 0 10px 14px}
.cross th.mute{color:var(--muted)}
.cross tr>th:first-child{position:sticky;left:0;z-index:1;background:var(--ground);text-align:left;padding-left:0;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.cross tbody th{font:400 14px/1.2 var(--ui);letter-spacing:0;text-transform:none;color:var(--amber)}
.cross tbody th small{margin-left:8px;font:400 10px/1 var(--mono);color:var(--muted)}
.cross td{border-top:1px solid var(--edge);text-align:right;padding:0 0 0 14px;font:300 18px/1 var(--ui);color:var(--muted)}
.xc{background:none;border:0;padding:12px 0;font:inherit;color:var(--dim);cursor:pointer;box-shadow:inset 0 -1px transparent}
.xc:hover{color:var(--ink)}
.xc.on{box-shadow:inset 0 -1px currentColor}
.xc.pos{color:var(--teal)}.xc.neg{color:var(--leak)}.xc.early{color:var(--muted)}.xc.bef{color:var(--dim)}
.xc i{display:block;margin-top:4px;font:400 10px/1 var(--mono);font-style:normal;color:var(--amber)}
.cross .types{margin:12px 0 2px}
.cr.lead{border-left-color:var(--amber)}

/* the commitments, and what each did to the line above */
.cm{margin-top:22px;border-top:1px solid var(--edge)}
.cr{display:grid;grid-template-columns:minmax(0,1fr) 130px 104px;gap:18px;align-items:center;padding:15px 0 15px 14px;border-bottom:1px solid var(--edge);border-left:2px solid var(--edge2);cursor:pointer;transition:background .18s}
.cr:hover{background:#0b0e10}
.cr.on{background:#0f1417}
.cr.pos{border-left-color:var(--teal)}.cr.neg{border-left-color:var(--leak)}.cr.tan,.cr.early{border-left-color:var(--amber)}
.cn b{display:block;font:400 16px/1.25 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn span{display:block;font:400 10.5px/1 var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:7px;white-space:nowrap}
.cr .mini{width:130px;height:34px;display:block}
.ce{display:flex;align-items:center;justify-content:flex-end;gap:8px;font:400 10px/1 var(--mono);color:var(--amber);letter-spacing:.08em}
.ce i{font-style:normal}
.ce b{font:300 26px/1 var(--ui);letter-spacing:-.01em;color:var(--muted)}
.ce b.pos{color:var(--teal)}.ce b.neg{color:var(--leak)}.ce b.tan{color:var(--amber)}.ce b.mid{color:var(--dim)}
.ce svg{width:12px;height:12px}
.end{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;color:var(--teal);cursor:pointer}
.end:hover{color:var(--ink)}
.end[disabled]{opacity:.35;cursor:default}

/* the three lines */
.line{display:grid;grid-template-columns:minmax(0,1fr) 150px 74px;gap:14px;align-items:end;margin-top:34px}
.line + .line{margin-top:14px}
.line input{background:none;border:0;border-bottom:1px solid var(--edge2);color:var(--ink);font:300 22px/1.2 var(--ui);padding:6px 0;width:100%;min-width:0;border-radius:0}
.line input[type=date]{font:400 13px/1.2 var(--mono);color:var(--dim);color-scheme:dark}
.line input:focus{border-bottom-color:var(--teal);outline:0}
.line select{background:var(--ground);border:0;border-bottom:1px solid var(--edge2);color:var(--dim);font:400 13px/1.2 var(--mono);padding:9px 0;width:100%;min-width:0;border-radius:0;color-scheme:dark}
.line select:focus{border-bottom-color:var(--teal);outline:0}
.line button{background:none;border:1px solid var(--edge2);color:var(--ink);font:400 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:14px 0;cursor:pointer}
.line button:hover{border-color:var(--teal);color:var(--teal)}
.line button[disabled]{opacity:.35;cursor:default}
.line.c4{grid-template-columns:minmax(0,1fr) 150px 150px 74px}
.line.new{grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr) 90px 74px}
.line .picks{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.line .picks button{padding:8px 10px;font:400 10px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.line .picks button:hover{color:var(--ink);border-color:var(--dim)}
.line .picks button[aria-pressed="true"]{color:var(--teal);border-color:var(--teal)}
.line .picks button.off{border-style:dashed}
.line .picks.levers button{border-style:dotted}
.line .picks.levers button[aria-pressed="true"]{color:var(--amber);border-color:var(--amber);border-style:solid}
.line .bad,.line .bad:focus,.rules .bad,.rules .bad:focus{border-bottom-color:var(--leak)}
.line .picks.bad button{border-color:var(--leak)}
.err{font:400 11px/1.6 var(--mono);letter-spacing:.04em;color:var(--leak);margin:14px 0 0;min-height:1.6em}

/* the ledger tab: what comes in, what it becomes, and every stock it tracks */
.acts{display:flex;align-items:center;gap:22px}
.tab{background:none;border:0;color:var(--muted);font:11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0 0 4px;box-shadow:inset 0 -1px transparent}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--amber);box-shadow:inset 0 -1px var(--amber)}
#ledgerview{margin-top:28px}
.vd td{color:var(--dim);text-decoration:line-through}
.vd td:first-child{text-decoration:none}
.how{display:flex;align-items:stretch}
.hb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--edge2);padding:14px 14px 12px}
.hb > i{font-style:normal;font:400 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.hb .hn{font:300 30px/1 var(--ui);letter-spacing:-.02em;margin-top:6px}
.hb .hn small{font:400 12px/1 var(--mono);color:var(--muted);margin-left:2px}
.hb span{font:400 10px/1.35 var(--mono);color:var(--muted)}
.hb em{font-style:normal;font:400 9.5px/1.35 var(--mono);color:var(--amber);letter-spacing:.03em}
.hl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.hl span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hl b{font:300 18px/1 var(--ui)}
.ha{flex:0 0 26px;position:relative}
.ha::after{content:'';position:absolute;left:4px;right:6px;top:50%;border-top:1px solid var(--edge2)}
.ha::before{content:'';position:absolute;right:2px;top:calc(50% - 3px);border-style:solid;border-width:3.5px 0 3.5px 5px;border-color:transparent transparent transparent var(--dim)}
.ha i{position:absolute;top:calc(50% - 1.5px);left:2px;width:3px;height:3px;border-radius:50%;background:var(--teal);animation:hop 1.4s linear infinite}
@keyframes hop{from{left:2px;opacity:0}20%{opacity:1}to{left:calc(100% - 8px);opacity:0}}
.types{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font:400 10.5px/1 var(--mono);color:var(--muted);letter-spacing:.06em}
.types b{font-weight:400;color:var(--ink);margin-left:6px}
.key{display:flex;gap:18px;flex-wrap:wrap;margin-top:30px;font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.key span::before{content:'';display:inline-block;width:16px;height:2px;margin-right:8px;vertical-align:middle;background:currentColor}
.key .up{color:var(--teal)}.key .down{color:var(--leak)}.key .flat{color:var(--ink)}.key .mute{color:var(--muted)}
/* the doors: one line each, its state in the colour of the bar and in no word */
.fd{margin-top:14px;display:flex;flex-direction:column;gap:5px}
.fr{display:flex;align-items:center;gap:10px;font:400 10px/1 var(--mono);color:var(--dim)}
.fr .fn{width:92px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr u{flex:1;min-width:20px;height:2px;background:var(--edge2);text-decoration:none}
.fr .fv{width:52px;text-align:right;color:var(--muted)}
.fr.ontime u{background:var(--teal)}
.fr.drifting u{background:var(--amber)}
.fr.stale u{background:var(--leak)}
.fr.stale .fn,.fr.stale .fv{color:var(--leak)}
.lane{margin-top:30px;border-top:1px solid var(--edge2);padding-top:16px}
.lh{display:flex;align-items:baseline;gap:10px}
.lh .lt{font:300 30px/1 var(--ui);letter-spacing:.02em;text-transform:uppercase}
.lh b{font:400 13px/1 var(--mono)}
.lh span{font:400 10px/1 var(--mono);color:var(--muted)}
.lh em{font-style:normal;margin-left:auto;font:400 10px/1 var(--mono);color:var(--muted)}
.src{margin-top:16px}
.sh{display:flex;align-items:baseline;gap:10px;font:400 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.sh b{font-weight:400;color:var(--ink);letter-spacing:.04em}
.sh em{font-style:normal;color:var(--muted);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.lb{display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--panel);border:1px solid var(--edge);border-top:2px solid var(--edge2);padding:10px 11px 9px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:background .18s}
.lb:hover{background:#0f1417}
.lb.up{border-top-color:var(--teal)}.lb.down{border-top-color:var(--leak)}.lb.flat{border-top-color:var(--ink)}
.lb .ln1{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.lb .nm{font:400 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .gl svg{width:10px;height:10px;display:block}
.lb .ln1 i{font-style:normal;font:400 9px/1 var(--mono);color:var(--muted);letter-spacing:.1em}
.lb > b{font:300 24px/1 var(--ui);letter-spacing:-.01em}
.lb > b small{font:400 10px/1 var(--mono);color:var(--muted);margin-left:3px}
.lb .tiny{width:100%;height:30px;display:block}
.lb .meta{font:400 9.5px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
.lb.mv .tiny,.lb.mv .gl{opacity:.45}   /* the baseline is still filling: the same fade the chart draws */
.lb.count{cursor:default}
.lb.count:hover{background:var(--panel)}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.lrow .k{font:400 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);width:66px}
.chip{font:400 10px/1 var(--mono);letter-spacing:.08em;color:var(--dim);border:1px solid var(--edge2);padding:7px 9px}
.chip.on{color:var(--amber);border-color:var(--amber)}
.lrow .arrow{color:var(--muted);padding:0 2px}
.lrow .cnt{font:300 22px/1 var(--ui);margin-left:8px}
.empty{font:400 11px/1 var(--mono);color:var(--muted);margin-top:12px}
.tw{overflow-x:auto;margin-top:10px}
.tw table{width:100%;border-collapse:collapse;font:400 11px/1.2 var(--mono);white-space:nowrap}
.tw td{padding:8px 14px 8px 0;border-bottom:1px solid var(--edge);color:var(--dim)}
.tw td:nth-child(2){color:var(--amber);text-transform:uppercase;letter-spacing:.12em;font-size:9.5px}
.tw td:nth-child(5){color:var(--ink)}
.tw td.r{text-align:right;color:var(--ink);padding-right:0}
@media (prefers-reduced-motion:reduce){.ha i{animation:none;display:none}}
@media (max-width:760px){
  .how{flex-direction:column}
  .ha{flex:0 0 22px}
  .ha::after{left:50%;right:auto;top:3px;bottom:6px;border-top:0;border-left:1px solid var(--edge2)}
  .ha::before{right:auto;left:calc(50% - 3px);top:auto;bottom:1px;border-width:5px 3.5px 0 3.5px;border-color:var(--dim) transparent transparent transparent}

<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TODAY = null;   // the ledger's day now, from day_of through readDay, set by load() before anything draws
// a start is in the future only past both the ledger's day and today on this computer's own calendar
const latestDay = () => { const d = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10); return TODAY && TODAY > d ? TODAY : d; };

// glyphs, and the word for an index: 100 is your usual, ten points one step
const UP = '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M6 2L11 10H1z" fill="#5fc4b4"/></svg>';
const DOWN = '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M6 10L1 2h10z" fill="#c9695c"/></svg>';
const FLAT = '<svg viewBox="0 0 12 12" width="12" height="12"><rect x="1" y="5" width="10" height="2" fill="#8d959a"/></svg>';
const word = r => r==null?{w:'',cls:''}:r>=110?{w:UP,cls:'pos'}:r<=90?{w:DOWN,cls:'neg'}:{w:FLAT,cls:''};
const sgn = v => (v>=0?'+':'')+(Math.round(v*10)/10);
const num = v => Number.isInteger(v) ? String(v) : Math.abs(v) >= 100 ? String(Math.round(v)) : String(Math.round(v*100)/100);
// the pad's own name rule, the same as pad.html
const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
function remember(m){ try { localStorage.setItem('wire.pad.metric', m); } catch (e) {} }
function remembered(){ try { return localStorage.getItem('wire.pad.metric'); } catch (e) { return null; } }

// ---- what the ledger says. every number below comes from you-reader.js ----
const YOU_ID = 'YOU';   // slugs are lower case, so no goal can take this id
const RANGES = { '1M': 30, '3M': 90, '6M': 182, '1Y': 365, 'ALL': 0 };
let ALL = [], RULES = {}, COMMITS = [], ALLCOMMITS = [], GOALS = [], SERIES = {}, OWNED = [], YOU = [], LAST = {}, UNITS = {}, SOURCES = {}, VOIDS = {}, CVOIDS = {}, FEEDS = [];   // VOIDS: which readings are not counted, by stock and day. CVOIDS: which commits are not counted. COMMITS is the ones that count, ALLCOMMITS the record. FEEDS: each door, how far behind it is, and whether that is its promise or a dead cable
let SEL = YOU_ID, FM = null, FC = null, FX = null, BAND = false, GPICK = new Set(), GLEVER = new Map(), RANGE = '3M';   // FM a picked stock, FC a picked commit, FX a picked lever and outcome
let D0 = 0, N = 0, VIEW = null, READY = false;   // the first day the chart can reach, as a day number, and how many days it holds
let RULING = false, ENDING = false;              // a rule row or an end row on its way: a double click writes one
let CROSS = null;   // every lever against its goal's outcomes, from crossGrid
let DAYS = [], LEDGER = null, LTOKEN = 0, SHOWLEDGER = location.hash === '#ledger';   // the day rows, the ledger's rows once its tab is open, and which view is up

async function load(){
  const [today, all, rules, goals, voids, cvoids, feeds] = await Promise.all([readDay(db), readMetrics(db), readRules(db), readGoals(db), readVoids(db), readCommitVoids(db), readFeeds(db)]);
  const [commits, rows] = await Promise.all([readCommits(db, today), all.length ? readDays(db, all) : []]);
  TODAY = today; ALL = all; RULES = rules; GOALS = goals; VOIDS = voids; CVOIDS = cvoids;
  FEEDS = feedOf(feeds);   // which doors are feeding the ledger, and which have stopped
  ALLCOMMITS = commits; COMMITS = liveCommits(commits, cvoids);   // a voided commit is in no test, no scan, and collides with nothing
  // OWNED is the stocks that actually have an index, so "stocks scored" counts only those and the
  // chart's window opens on a day something is drawn on. YOU is built from them through the same gate
  SERIES = rankSeries(rows, rules, voids); OWNED = Object.keys(SERIES).filter(m => indexState(SERIES[m]) !== 'none'); YOU = etfSeries(SERIES, OWNED);
  DAYS = rows; LEDGER = null; LTOKEN++;
  CROSS = crossGrid(GOALS, liveRows(rows, voids), SERIES, TODAY);   // a voided reading is no more a lever than an outcome
  LAST = {}; for (const r of rows) if (!voidedOn(voids, r.metric, r.day)) LAST[r.metric] = r;   // readDays is oldest first; a voided reading is not the latest one
  // each stock's unit and every source that has written it, newest first
  const { data: u, error: ue } = await db.from('events').select('metric, unit, source').eq('event_type', 'measurement').order('occurred_at', { ascending: false }).limit(20000);
  if (ue) throw ue;
  UNITS = {}; SOURCES = {};
  for (const r of u){ if (r.unit && !(r.metric in UNITS)) UNITS[r.metric] = r.unit; const s = SOURCES[r.metric] || (SOURCES[r.metric] = []); if (r.source && !s.includes(r.source)) s.push(r.source); }
  // a year back, further only to hold a reading or a commit's before
  const t = dayNum(TODAY); let lo = t - 364;
  for (const m of OWNED) lo = Math.min(lo, dayNum(SERIES[m][0].day));
  for (const c of COMMITS){ const s = dayNum(c.from), e = Math.min(dayNum(c.to || TODAY), t); lo = Math.min(lo, s - Math.max(2, e - s + 1) - 3); }
  D0 = lo; N = t - lo + 1;
  if (!(SEL === YOU_ID || GOALS.some(g => g.id === SEL))) SEL = YOU_ID;
  if (FC && !COMMITS.some(c => c.id === FC)) FC = null;
  if (FX && !cellOf(FX)) FX = null;
}
const dstr = n => new Date(n * 864e5).toISOString().slice(0, 10);
const arrOf = pts => { const a = new Array(N).fill(null); for (const p of pts){ const i = dayNum(p.day) - D0; if (i >= 0 && i < N) a[i] = p.rank; } return a; };
// YOU is the goal made of every stock with a rule
const youGoal = () => ({ id: YOU_ID, name: 'YOU', measures: OWNED, target: null });
const cur = () => SEL === YOU_ID ? youGoal() : GOALS.find(g => g.id === SEL);
const pointsOf = g => g.id === YOU_ID ? YOU : goalSeries(g, SERIES);
const listOf = g => g.id === YOU_ID ? ALL : g.measures;   // YOU lists every stock, so what it leaves out shows
const say = m => { $('err').textContent = m || ''; };
// the reader draws no day on which a scored stock is stale, so while one is stale today the index is silent too
const stale = m => !!SERIES[m] && dayNum(TODAY) - dayNum(SERIES[m][SERIES[m].length-1].day) > STALE_DAYS;
const since = day => dayNum(TODAY) - dayNum(day);   // days since a reading, as a stale stock and the target show it
const silent = g => g.measures.some(stale);
const shown = () => FX && SERIES[FX.o] ? FX.o : FM && SERIES[FM] ? FM : null;   // the stock the chart shows: a picked outcome, or a picked scored stock
const cellOf = x => { const b = CROSS && CROSS.blocks.find(b => b.id === x.g), l = b && b.levers.find(l => l.metric === x.l), c = l && l.cells[x.o]; return c ? { b, l, c } : null; };

function render(){ drawRail(); drawLines(); if (SHOWLEDGER) showLedger(); else draw(); }
function draw(anim = true){ const g = cur(), m = shown();
  const fx = FX && cellOf(FX);
  if (!SHOWLEDGER) $('eyebrow').textContent = g.name + (fx ? ` · ${FX.o} · ${FX.l} +${fx.l.lag} d` : m ? ' · ' + m : '');
  drawFlow(g); drawRules(g); drawChart(anim); drawHead(null); drawTarget(g); drawRanges(); drawCross(g); drawCommits(); drawWeak(g); }

// ---- goals, listed like stocks: name, the line, the index and its move ----
function moveOf(pts){ if (pts.length < 8) return null; return Math.round((pts[pts.length-1].rank - pts[pts.length-8].rank) * 10) / 10; }
function spark(pts, cls){ const a = pts.slice(-45); if (a.length < 3) return '<svg viewBox="0 0 60 24"></svg>';
  const v = a.map(p => p.rank), lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const d = a.map((p, i) => (i ? 'L' : 'M') + (i * 60 / (a.length - 1)).toFixed(1) + ' ' + (2 + (hi - p.rank) * 20 / span).toFixed(1)).join('');
  return `<svg viewBox="0 0 60 24" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${cls === 'pos' ? '#5fc4b4' : cls === 'neg' ? '#c9695c' : '#5c656b'}" stroke-width="1.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`; }
function drawRail(){
  // a goal under the gate has no index and no line to show: its name, and nothing more
  const row = (g, pts) => { const drawn = !silent(g) && indexState(pts) !== 'none';
    const p = drawn ? pts[pts.length-1] : null, mv = p ? moveOf(pts) : null, cls = mv == null ? '' : mv > 0 ? 'pos' : mv < 0 ? 'neg' : '';
    return `<button type="button" class="gr${g.id === SEL ? ' on' : ''}" data-id="${esc(g.id)}"><span class="nm">${esc(g.name)}</span>${drawn ? spark(pts, cls) : ''}<span class="v">${p ? p.rank : '&#183;'}<em class="${cls}">${mv == null ? '' : sgn(mv)}</em></span></button>`; };
  $('rail').innerHTML = row(youGoal(), YOU) + GOALS.map(g => row(g, goalSeries(g, SERIES))).join('') + `<button type="button" class="gr add" id="plus" aria-label="goal">+</button>`;
}
function pickGoal(id){ SEL = id; FM = null; FC = null; FX = null; BAND = false; SHOWLEDGER = false; applyView(); say(''); fillGoalLine(); render(); }
function newGoal(){ for (const id of ['gname', 'gtm', 'gtv', 'gpicks', 'glevers']) $(id).classList.remove('bad');
  $('gname').value = ''; $('gtm').value = ''; $('gtv').value = ''; GPICK = new Set(); GLEVER = new Map(); drawPicks();
  $('goalf').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('gname').focus({ preventScroll: true }); }

// ---- the number: the index now, or where the pointer is, and its move across the window ----
function drawHead(hi){
  const g = cur(), v = VIEW, m = v.m;
  let val = null, day = null;
  // under the gate there is no index, so the big number stays empty the way it does for a stock with
  // no readings at all. The header never writes a number the chart did not draw
  if (v.gate !== 'none'){
    if (hi != null && v.line[hi] != null){ val = v.line[hi]; day = dstr(D0 + hi); }
    else if (!(m ? stale(m) : silent(g))){ const p = v.pts[v.pts.length-1]; if (p){ val = p.rank; day = p.day; } }
  }
  let first = null; for (let i = v.i0; i <= v.i1; i++) if (v.line[i] != null){ first = v.line[i]; break; }
  const ch = val != null && first != null ? Math.round((val - first) * 10) / 10 : null;
  $('bn').textContent = val == null ? '·' : val; $('bn').className = 'big ' + word(val).cls;
  $('bc').textContent = ch == null ? '' : sgn(ch); $('bc').className = ch > 0 ? 'pos' : ch < 0 ? 'neg' : '';
  $('bd').textContent = day || '';
}
function drawTarget(g){
  let aim = '', tg = '', old = false;
  if (g.target){ const t = g.target, unit = UNITS[t.metric] ? ' ' + esc(UNITS[t.metric]) : '', lr = LAST[t.metric];
    const a = t.value != null ? num(t.value) : `${num(t.lo)}&#8211;${num(t.hi)}`;
    aim = `<span>${a}${unit}</span>`;
    if (!lr) tg = `<i>${esc(t.metric)}</i><span>${a}${unit}</span><b>empty</b>`;
    else { const now = Number(lr.mean), age = since(lr.day); old = age > STALE_DAYS;
      const gap = Math.round((t.value != null ? now - t.value : now < t.lo ? now - t.lo : now > t.hi ? now - t.hi : 0) * 100) / 100;
      const g2 = old ? '<b>stale</b>' : `<b class="${gap === 0 ? 'pos' : 'neg'}">${gap === 0 ? '0' : (gap>0?'+':'')+num(gap)}</b>`;
      // the reading and the target drawn on one scale from zero: a picture of the two numbers, not a new one
      const top = Math.max(now, t.value != null ? t.value : t.hi), at = v => (Math.max(0, Math.min(1, v / top)) * 100).toFixed(1);
      const bar = top > 0 && now >= 0 ? `<span class="gv-bar${old ? ' gv-old' : ''}"><em class="${gap === 0 ? 'pos' : ''}" style="width:${at(now)}%"></em>${(t.value != null ? [t.value] : [t.lo, t.hi]).map(v => `<s style="left:${at(v)}%"></s>`).join('')}</span>` : '<span></span>';
      tg = `<i>${esc(t.metric)}</i><b>${num(now)}</b>${bar}<b>${a}</b><span>${lr.day.slice(5)} &#183; ${age} d</span>${g2}`; }
    tg = `<p class="gv-h">TARGET</p><div class="gv-tr${old ? ' gv-old' : ''}">${tg}</div>`; }
  $('gaim').innerHTML = aim; $('tg').innerHTML = tg;
}

// ---- what is counted: sources, the stocks they write, the goal those stocks make ----
const FLOW_ROWS = 6;   // up to this many stocks, full names; past it, a source's shared prefix is left off
function drawFlow(g){
  const ms = listOf(g), weak = weakPoint(g, SERIES), f = $('flow');
  if (!ms.length){ f.innerHTML = ''; f.classList.remove('grouped'); return; }
  const state = m => { const s = SERIES[m]; if (!s) return RULES[m] && RULES[m].kind === 'ignore' ? 'ignored' : LAST[m] ? 'unscored' : 'empty'; return stale(m) ? 'stale' : ''; };
  // the index gate, in no words: under it there is no index to show, and while the baseline is still
  // filling the index is dimmed. The same three states the chart draws, from the same one function
  const gate = m => indexState(SERIES[m]);

  $('gname').value = g ? g.name : ''; $('gtm').value = g && g.target ? g.target.metric : '';
  $('gtv').value = g && g.target ? (g.target.value != null ? String(g.target.value) : `${g.target.lo} to ${g.target.hi}`) : '';
  GPICK = new Set(g ? g.measures : []); GLEVER = new Map(g ? g.levers.map(l => [l.metric, l.lag]) : []); drawPicks(); }

// the pad's line. a number is a reading, anything else is a note. the rows are pad.html's rows
async function lastUnit(metric){
  const { data, error } = await db.from('events').select('value, unit, occurred_at').eq('metric', metric).eq('event_type', 'measurement').not('value', 'is', null).order('occurred_at', { ascending: false }).limit(7);
  if (error){ say(error.message); return undefined; }
  return (data.find(r => r.unit) || {}).unit || null;
}
$('padf').addEventListener('submit', async e => { e.preventDefault(); say('');
  const raw = $('pval').value.trim(); if (!raw){ bad($('pval')); return; }
  $('padd').disabled = true;
  const n = Number(raw), isNumber = Number.isFinite(n);
  let metric = $('pstock').value, unit = null;
  if (metric === ''){ metric = slug($('pname').value); if (!metric){ $('padd').disabled = false; bad($('pname')); return; } unit = $('punit').value.trim() || null; }
  else { unit = await lastUnit(metric); if (unit === undefined){ $('padd').disabled = false; return; } }
  const row = isNumber
    ? { occurred_at: new Date().toISOString(), metric, value: n, unit, source: 'pad' }
    : { occurred_at: new Date().toISOString(), metric, event_type: 'note', value: null, source: 'you', context: { text: raw } };
  const { error } = await db.from('events').insert(row); $('padd').disabled = false;
  if (error){ say(error.message); return; }
  $('pval').value = ''; $('pname').value = ''; $('punit').value = ''; remember(metric);
  await load(); render(); $('pstock').value = ALL.includes(metric) ? metric : ''; padNew();
});

// the commit line. a start row, and an end row if it has ended. the rows are commit.html's rows
async function endCommit(id, to){
  const c = COMMITS.find(x => x.id === id), day = to || (c && c.from > TODAY ? c.from : TODAY);   // never before its start, which can be a local today the ledger has not reached
  const { error } = await db.from('events').insert({ occurred_at: new Date(day + 'T12:00:00Z').toISOString(), metric: id, event_type: 'commit_end', source: 'you', context: { to: day } });
  if (error){ say(error.message); return false; }
  return true;
}
$('cmf').addEventListener('submit', async e => { e.preventDefault(); say('');
  const name = $('cwhat').value.trim(), from = $('cfrom').value, to = $('cto').value;
  if (!name){ bad($('cwhat')); return; }
  if (!from || from > latestDay()){ bad($('cfrom')); return; }
  if (to && to < from){ bad($('cto')); return; }
  const id = slugCommit(name);
  if (COMMITS.some(c => c.id === id)){ bad($('cwhat')); say('exists'); return; }
  $('cadd').disabled = true;
  const { error } = await db.from('events').insert({ occurred_at: new Date(from + 'T12:00:00Z').toISOString(), metric: id, event_type: 'commit', source: 'you', context: { name, from } });
  if (error){ $('cadd').disabled = false; say(error.message); return; }
  if (to){ const ok = await endCommit(id, to); if (!ok){ $('cadd').disabled = false; await load(); render(); return; } }   // the start row is in, so a second add says exists
  $('cadd').disabled = false; $('cwhat').value = ''; $('cto').value = ''; $('cfrom').value = TODAY;
  await load(); render();
});

// the goal line. a name, a target on one stock if there is one, and the stocks it is made of
function parseTarget(){
  const metric = $('gtm').value, s = $('gtv').value.trim();
  if (!metric && !s) return { target: null };
  if (!metric) return { bad: $('gtm') };
  if (!s) return { bad: $('gtv') };
  const band = s.match(/^(-?\d+(?:\.\d+)?)\s*(?:to|–|-)\s*(-?\d+(?:\.\d+)?)$/);
  if (band){ const lo = Number(band[1]), hi = Number(band[2]); return hi > lo ? { target: { metric, lo, hi } } : { bad: $('gtv') }; }
  const v = Number(s); return Number.isFinite(v) ? { target: { metric, value: v } } : { bad: $('gtv') };
}
$('goalf').addEventListener('submit', async e => { e.preventDefault(); say('');
  const name = $('gname').value.trim(); if (!name || !slug(name)){ bad($('gname')); return; }
  const measures = [...GPICK]; if (!measures.length){ bad($('gpicks')); return; }
  const p = parseTarget(); if (p.bad){ bad(p.bad); return; }
  $('gadd').disabled = true;
  try { const { error } = await writeGoal(db, name, measures, p.target, [...GLEVER].map(([metric, lag]) => ({ metric, lag })));
    if (error){ say(error.message); return; }
    SEL = slugCommit(name); FM = null; FC = null; FX = null; BAND = false; await load(); fillGoalLine(); render(); }
  finally { $('gadd').disabled = false; }   // held through the reload, so the same goal is not written twice
});

$('out').onclick = async () => { await db.auth.signOut(); location.href = 'index.html'; };
db.auth.getSession().then(async ({ data }) => {
  if (!data.session){ location.href = 'index.html'; return; }
  try {
    // right after sign in the database can see a fresh token a second early and refuse it. once more, a moment later
    try { await load(); } catch (e) { if (!/jwt/i.test(e.message || '')) throw e; await new Promise(r => setTimeout(r, 1500)); await load(); }
    fillGoalLine(); READY = true; applyView(); render(); lastW = Math.round($('chart').clientWidth);
  } catch (e) { say(e.message || String(e)); }
});
</script>
