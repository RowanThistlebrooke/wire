<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* the face. same maths (you-reader.js), new skin. tokens from STYLE.md, black. */
:root{--ground:#050607;--surface:#0a0d0f;--edge:#1e262b;--edge2:#2c363d;--ink:#e8e4dc;--dim:#9ba4a7;--muted:#6e777b;
 --teal:#4bb5a6;--amber:#e3a33f;--leak:#c05a4c;
 --ui:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:var(--mono)}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* frame */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.app.closed{grid-template-columns:0 minmax(0,1fr)}
.app.focus{grid-template-columns:0 minmax(0,1fr)}
.side{border-right:1px solid var(--edge);background:var(--surface);position:sticky;top:0;height:100vh;overflow:hidden auto;scrollbar-width:thin}
.app.closed .side,.app.focus .side{border-right:0;visibility:hidden}
.sideIn{width:288px;padding:26px 16px 120px 14px}
.main{padding:30px 40px 130px}
.bar{display:flex;align-items:center;gap:14px}
.bar .tog{background:none;border:1px solid var(--edge);color:var(--dim);width:32px;height:28px;border-radius:6px;cursor:pointer;padding:0;display:grid;place-items:center}
.bar .tog:hover{color:var(--ink)}
.eyebrow{font:11px/1 var(--mono);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:0}
.lab{font:700 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.pos{color:var(--teal)}.neg{color:var(--leak)}.mu{color:var(--muted)}
.err{font:12px/1.6 var(--mono);color:var(--leak);margin-top:14px}

/* sidebar: YOU and every metric you score */
.tk{display:grid;grid-template-columns:minmax(0,1fr) 60px 70px;gap:10px;align-items:center;padding:13px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.tk:hover{background:#0f1316}
.tk.on{border-color:var(--edge2);background:#0f1316}
.tk .s{font:800 17px/1.1 var(--ui);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .n{font:10.5px/1.4 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.tk svg{display:block;width:60px;height:28px}
.tk .p{text-align:right}
.tk .val{font:700 15px/1.1 var(--mono);white-space:nowrap}
.tk .c{display:inline-block;margin-top:5px;font:700 10.5px/1 var(--mono);padding:3px 6px;border-radius:4px;border:1px solid var(--edge);min-width:54px;text-align:right;white-space:nowrap}
.c.up{border-color:var(--teal);color:var(--teal)}.c.dn{border-color:var(--leak);color:var(--leak)}.c.na{color:var(--muted)}
.tk.off .s{color:var(--muted)}
.sidelab{margin:18px 9px 4px}

/* the number */
.head2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:56px;align-items:start;margin-top:10px}
.tick{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-top:22px}
.sym{font:800 clamp(30px,5vw,46px)/.85 var(--ui);letter-spacing:-.04em;color:var(--dim);padding-bottom:8px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now{font:800 clamp(72px,9vw,136px)/.8 var(--ui);letter-spacing:-.05em}
.delta{font:700 18px/1 var(--mono);padding-bottom:10px}
.tickmeta{font:12px/1.7 var(--mono);color:var(--muted);margin-top:14px}
.tickmeta b{color:var(--dim);font-weight:400}
.rules{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.rules button{background:none;border:1px solid var(--edge);color:var(--muted);font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:9px 11px;border-radius:5px;cursor:pointer}
.rule
