<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* the one look. tokens from STYLE.md, two fonts, one job each. */
:root{
  --ground:#0e1113; --surface:#15191c; --edge:#2a3338; --edge2:#38424a;
  --ink:#e8e4dc; --dim:#9ba4a7; --muted:#6e777b;
  --teal:#4bb5a6; --amber:#e3a33f; --leak:#c05a4c;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font:13px/1.6 var(--m);font-variant-numeric:tabular-nums;
     -webkit-font-smoothing:antialiased;padding:22px 18px 90px;max-width:720px;margin-inline:auto}

/* the number. YOU is the page, not a card on it. */
.hero{border-bottom:1px solid var(--edge);padding-bottom:18px}
.sym{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.sym h1{font:800 clamp(44px,8vw,62px)/.85 var(--ui);letter-spacing:-.05em}
.sym .idx{font:800 clamp(44px,8vw,62px)/.85 var(--ui);letter-spacing:-.04em}
.sym .real{font:400 12px/1 var(--m);color:var(--muted)}
.sym .delt{font:700 13px/1 var(--m);margin-left:auto;letter-spacing:.04em}
.up{color:var(--teal)} .dn{color:var(--leak)} .flat{color:var(--muted)}
svg.big{display:block;width:100%;height:210px;margin-top:16px}
.under{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
       font:700 9px/1.6 var(--m);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:8px}

/* labels describe. they never shout. */
h2{font:700 9px/1 var(--m);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}

/* the commit lane. state is a border and an opacity, never a fill. */
.lane{position:relative;height:24px;margin-bottom:6px}
.clip{position:absolute;height:20px;top:2px;border-radius:4px;padding:0 8px;
      font:700 10px/18px var(--m);white-space:nowrap;overflow:hidden;
      background:none;color:var(--amber);border:1px solid var(--amber);opacity:.55}
.clip.live{opacity:1}
.axis{display:flex;justify-content:space-between;color:var(--muted);
      font:400 9px/1 var(--m);letter-spacing:.1em;border-top:1px solid var(--edge);
      padding-top:9px;margin-top:6px}

/* a stock is a row, not a card. name and value in Archivo, everything small in mono. */
.r{border-bottom:1px solid #1c2226;padding:12px 0}
.rh{display:grid;grid-template-columns:minmax(90px,1fr) 96px 64px;gap:12px;align-items:center}
.rh .s{font:800 15px/1.15 var(--ui);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.rh .s small{display:block;font:400 9.5px/1.6 var(--m);color:var(--muted);letter-spacing:.04em;margin-top:2px}
.spark{height:26px}
.spark svg{display:block;width:100%;height:26px}
.rh .v{text-align:right;font:800 15px/1 var(--ui);letter-spacing:-.02em}
.rh .v em{display:block;font:400 9.5px/1.7 var(--m);font-style:normal;color:var(--muted)}
.stale{color:var(--amber)}

/* rules. a pressed rule is a teal border, not a fill. */
.rules{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.rules button{background:none;border:1px solid var(--edge);color:var(--muted);
  font:700 9.5px/1 var(--m);letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border-radius:4px;cursor:pointer}
.rules button:hover{color:var(--ink);border-color:var(--dim)}
.rules button[aria-pressed="true"]{color:var(--teal);border-color:var(--teal)}
.band{display:flex;gap:8px;align-items:baseline;margin-top:10px;flex-wrap:wrap}
.band span{color:var(--muted);font:700 9px/1 var(--m);letter-spacing:.18em;text-transform:uppercase}
.band input{width:84px;background:none;border:0;border-bottom:2px solid var(--edge);color:var(--ink);
  font:800 16px/1.3 var(--ui);letter-spacing:-.02em;padding:4px 0;outline:0;min-width:0}
.band input:focus{border-bottom-color:var(--teal)}
.band button{background:none;color:var(--ink);border:1px solid var(--edge);font:700 9.5px/1 var(--m);
  letter-spacing:.14em;text-transform:uppercase;padding:9px 13px;border-radius:4px;cursor:pointer}
.band button:hover{border-color:var(--teal);color:var(--teal)}

.note{color:var(--muted);font:400 10px/1.7 var(--m);letter-spacing:.06em}
.err{color:var(--leak);font:400 11px/1.6 var(--m)}
.foot{margin-top:34px;display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-top:16px}
a{color:var(--muted);font:700 9.5px/1 var(--m);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:6px 0}
a:hover{color:var(--teal)}
</style>

<div id="hero"></div>
<div id="out"></div>
<div id="rest"></div>

<div class="foot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="nav.js" defer></script>
<script src="you-reader.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
let OPEN = null;   // which metric has its band editor open

function line(points, colour, key, mark, w, h) {
  if (points.length < 2) return '<svg></svg>';
  const pad = 4;
  const vals = points.map(p => p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  // Keep the 100 line inside the drawing, so above and below always read.
  if (mark !== undefined) { lo = Math.min(lo, mark); hi = Math.max(hi, mark); }
  const span = (hi - lo) || 1;
  const step = (w - pad * 2) / (points.length - 1);
  const y = v => h - pad - ((v - lo) / span) * (h - pad * 2);
  const d = points.map((p, i) => `${pad + i * step},${y(p[key])}`).join(' ');
  const base = mark === undefined ? '' :
    `<line x1="${pad}" y1="${y(mark)}" x2="${w - pad}" y2="${y(mark)}"
           stroke="#2b3439" stroke-width="1" stroke-dasharray="3 4"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="over time">
    ${base}
    <polyline points="${d}" fill="none" stroke="${colour}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// The move over the last seven readings. People read the change first.
function moveOf(points) {
  if (points.length < 8) return '';
  const now = points[points.length - 1].rank;
  const then = points[points.length - 8].rank;
  const d = Math.round((now - then) * 10) / 10;
  if (d === 0) return '<span class="delt flat">flat · 7d</span>';
  return `<span class="delt ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)} · 7d</span>`;
}

const label = r => !r ? '' :
  r.kind === 'band' ? `best ${r.lo} to ${r.hi}` : r.kind;

function ruleButtons(metric, rule) {
  const k = rule && rule.kind;
  const b = (kind, text) =>
    `<button data-m="${metric}" data-k="${kind}" aria-pressed="${k === kind}">${text}</button>`;
  let html = `<div class="rules">${b('up', 'up')}${b('down', 'down')}` +
             `${b('band', 'best between')}${b('ignore', 'ignore')}</div>`;
  if (OPEN === metric) {
    html += `<div class="band">
      <span>best between</span>
      <input id="lo" type="number" step="any" value="${rule && rule.lo !== undefined ? rule.lo : ''}">
      <span>and</span>
      <input id="hi" type="number" step="any" value="${rule && rule.hi !== undefined ? rule.hi : ''}">
      <button data-m="${metric}" data-k="save">set</button>
    </div>`;
  }
  return html;
}

// A commit has no line of its own. It is a span, drawn under everything else.
function lanes(commits, you) {
  if (!commits.length || you.length < 2) return '';
  const a = dayNum(you[0].day), b = dayNum(you[you.length - 1].day);
  const span = (b - a) || 1;
  const today = dayNum(new Date().toISOString().slice(0, 10));
  const pc = d => Math.max(0, Math.min(100, ((d - a) / span) * 100));
  const bars = commits.map(c => {
    const s0 = pc(dayNum(c.from)), s1 = pc(Math.min(dayNum(c.to || today), b));
    const w = Math.max(7, s1 - s0);
    return `<div class="lane"><div class="clip ${c.to ? '' : 'live'}"
      style="left:${s0}%;width:${w}%">${c.name}</div></div>`;
  }).join('');
  return `<h2>what changed</h2>${bars}
    <div class="axis"><span>${you[0].day}</span><span>${you[you.length - 1].day}</span></div>`;
}

// YOU is the page. Real reading from day one, index from day fourteen.
function hero(points, note) {
  const n = points.length;
  const ready = n >= 14;
  const p = points[n - 1];
  const big = !p ? '—' : ready ? p.rank : (p.value !== undefined ? p.value : '—');
  const real = ready && p && p.value !== undefined
    ? `<span class="real">${p.value}</span>` : '';
  const days = ready ? `${n} days` : `${n} / 14 days`;
  return `<div class="hero">
    <div class="sym">
      <h1>YOU</h1><span class="idx">${big}</span>${real}
      ${ready ? moveOf(points) : ''}
    </div>
    ${line(points, '#e3a33f', ready ? 'rank' : 'value', ready ? 100 : undefined, 1000, 210)}
    <div class="under"><span>${days}</span><span>${note}</span></div>
  </div>`;
}

// A stock is a row, not a card.
function row(name, points, right, note) {
  const n = points.length;
  const ready = n >= 14;
  const p = points[n - 1];
  const big = !p ? '—' : ready ? p.rank : (p.value !== undefined ? p.value : '—');
  const sub = ready ? (p && p.value !== undefined ? p.value : `${n}d`) : `${n}/14`;
  return `<div class="r">
    <div class="rh">
      <div class="s">${name}<small>${note || (ready ? n + ' days' : n + ' / 14')}</small></div>
      <div class="spark">${line(points, '#4bb5a6', ready ? 'rank' : 'value', ready ? 100 : undefined, 300, 26)}</div>
      <div class="v">${big}<em>${sub}</em></div>
    </div>
    ${right || ''}
  </div>`;
}

async function set(metric, kind) {
  if (kind === 'band' && OPEN !== metric) { OPEN = metric; render(); return; }
  let rule = { kind };
  if (kind === 'save') {
    const lo = Number(document.getElementById('lo').value);
    const hi = Number(document.getElementById('hi').value);
    if (!isFinite(lo) || !isFinite(hi) || hi <= lo) {
      hero_err('low, then high.'); return;
    }
    rule = { kind: 'band', lo, hi };
  }
  OPEN = null;
  const { error } = await writeRule(db, metric, rule);
  if (error) { hero_err(error.message); return; }
  render();
}

function hero_err(msg) {
  document.getElementById('hero').insertAdjacentHTML('beforeend',
    `<p class="err">${msg}</p>`);
}

function wire(el) {
  el.querySelectorAll('button[data-m]').forEach(b =>
    b.onclick = () => set(b.dataset.m, b.dataset.k));
}

async function render() {
  const [all, rules, commits] = await Promise.all(
    [readMetrics(db), readRules(db), readCommits(db)]);
  const rows = await readDays(db, all);
  const series = rankSeries(rows, rules);
  const owned = Object.keys(series);

  const today = dayNum(new Date().toISOString().slice(0, 10));
  const staleOf = m => {
    const pts = series[m];
    const age = today - dayNum(pts[pts.length - 1].day);
    return age > STALE_DAYS ? `stale · ${age} days` : '';
  };

  if (!owned.length) {
    document.getElementById('hero').innerHTML =
      `<div class="hero"><div class="sym"><h1>YOU</h1><span class="idx">—</span></div>
       <div class="under"><span>0 scored</span></div></div>`;
    out.innerHTML = '';
  } else {
    const you = etfSeries(series, owned);
    const cov = coverage(series, owned);
    const skipped = cov.days - cov.drawn;
    document.getElementById('hero').innerHTML = hero(you,
      (skipped ? `${skipped} days not drawn · stale`
                : 'all days') + ` · ${owned.length} stocks`);

    let html = lanes(commits, you) + '<h2>stocks</h2>';
    for (const m of owned) {
      const st = staleOf(m);
      html += row(m, series[m], ruleButtons(m, rules[m]),
                  st ? `<span class="stale">${st}</span>` : '');
    }
    out.innerHTML = html;
    wire(out);
  }

  const undecided = all.filter(m => !(m in rules));
  const ignored = Object.keys(rules).filter(m => rules[m].kind === 'ignore');
  const block = (title, list, rulesFor) => !list.length ? '' :
    `<h2>${title}</h2>` + list.map(m => `<div class="r">
       <div class="rh"><div class="s">${m}</div><div></div><div></div></div>
       ${ruleButtons(m, rulesFor ? rules[m] : null)}
     </div>`).join('');

  rest.innerHTML = block('not scored', undecided, false) +
                   block('ignored', ignored, true);
  wire(rest);
}

db.auth.getSession().then(({ data }) => {
  if (!data.session) { location.href = 'index.html'; return; }
  render();
});
</script>
