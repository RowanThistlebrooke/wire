<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--ground:#070809;--panel:#0c0f11;--edge:#171c20;--edge2:#232a30;--ink:#e6e3dc;--dim:#8d959a;--muted:#5c656b;
 --teal:#5fc4b4;--tealsoft:rgba(95,196,180,.12);--amber:#c9a25a;--leak:#c9695c;--leaksoft:rgba(201,105,92,.12);
 --ui:"Archivo","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font-family:var(--mono)}
button:focus-visible,input:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
.main{max-width:720px;margin:0 auto;padding-block:20px 90px;padding-inline:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.eyebrow{font:11px/1 var(--mono);letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:0}
.out{background:none;border:0;color:var(--muted);font:11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0}
.demo{margin:14px 0 0;font:11px/1.6 var(--mono);letter-spacing:.06em;color:var(--amber);border:1px solid var(--edge2);padding:8px 10px}

/* the one number */
.hero{display:flex;gap:26px;align-items:center;margin-top:30px;padding-bottom:22px;border-bottom:1px solid var(--edge)}
.hero .big{font:300 92px/.9 var(--ui);letter-spacing:-.03em}
.hero .big.pos{color:var(--teal)}.hero .big.neg{color:var(--leak)}
.hero .side{display:flex;flex-direction:column;gap:12px}
.hero .side .l{font:400 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.hero .side .w{display:flex;align-items:center}
.hero .side .w svg{width:56px;height:56px}
.hero .side .s{font:400 11px/1.6 var(--mono);color:var(--dim);margin-top:8px;letter-spacing:.04em}
@media (max-width:520px){.hero{gap:18px}.hero .big{font-size:64px}.hero .side .w svg{width:40px;height:40px}}

/* key */
.key{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 0;font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.key i{display:inline-block;width:8px;height:8px;margin-right:7px;vertical-align:middle}
.key i.t{background:var(--teal)}.key i.r{background:var(--leak)}.key i.g{background:var(--edge2)}.key i.a{background:var(--amber)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}
.t{background:var(--panel);border:1px solid var(--edge);border-top:2px solid var(--edge2);padding:12px 12px 10px;min-width:0}
.t.pos{border-top-color:var(--teal)}.t.neg{border-top-color:var(--leak)}
.t .n{font:400 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t b{display:block;font:300 30px/1 var(--ui);margin-top:10px}
.t b small{font:400 10px/1 var(--mono);color:var(--muted);margin-left:3px}
.t .w{margin-top:8px;height:12px;display:flex;align-items:center}
.t > svg{margin-top:10px;height:26px}
.t .w svg{width:12px;height:12px;margin:0}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* chart */
.chart{margin-top:24px;background:var(--panel);border:1px solid var(--edge);padding:12px 10px 6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 8px 4px;font:400 10px/1 var(--mono);letter-spacing:.08em;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:1.5px;vertical-align:middle;margin-right:6px}
svg{width:100%;height:auto;display:block}

/* one line */
.line{display:grid;grid-template-columns:minmax(0,1fr) 150px 74px;gap:14px;align-items:end;margin-top:34px}
.line input{background:none;border:0;border-bottom:1px solid var(--edge2);color:var(--ink);font:300 22px/1.2 var(--ui);padding:6px 0;width:100%;min-width:0;border-radius:0}
.line input[type=date]{font:400 13px/1.2 var(--mono);color:var(--dim)}
.line input:focus{border-bottom-color:var(--teal);outline:0}
.line button{background:none;border:1px solid var(--edge2);color:var(--ink);font:400 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:14px 0;cursor:pointer}
.line button:hover{border-color:var(--teal);color:var(--teal)}
@media (max-width:520px){.line{grid-template-columns:1fr 1fr}.line input[type=text]{grid-column:1/3}}

/* decisions */
.list{margin-top:28px}
.d{background:var(--panel);border:1px solid var(--edge);border-left:2px solid var(--edge2);padding:16px 16px 14px;margin-bottom:10px}
.d.pos{border-left-color:var(--teal)}.d.neg{border-left-color:var(--leak)}.d.early{border-left-color:var(--amber)}
.d .h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.d .h b{font:400 19px/1.3 var(--ui)}
.d .h span{font:400 11px/1 var(--mono);color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.d .h span em{font-style:normal;color:var(--dim)}
.d .say{font:300 15px/1.5 var(--ui);color:var(--dim);margin:8px 0 0;max-width:60ch}
.d .say em{font-style:normal;color:var(--ink)}
.d .say em.pos{color:var(--teal)}.d .say em.neg{color:var(--leak)}
.fx{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.f{min-width:0;padding:8px 8px 8px;margin:-8px -8px -8px;cursor:pointer;border:1px solid transparent;transition:background .18s,border-color .18s}
.f:hover{background:rgba(255,255,255,.025)}
.f.sel{background:rgba(255,255,255,.04);border-color:var(--edge2);animation:pop .32s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.d{cursor:pointer;transition:background .18s,border-color .18s}
.d.on{background:#0f1518;border-color:var(--edge2)}
.chart.sw svg{animation:fade .35s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
.chart .trend{animation:drawline 2.4s cubic-bezier(.4,0,.2,1) .5s forwards}
@keyframes drawline{to{stroke-dashoffset:0}}
.chart .pct{opacity:0;animation:fadein .7s ease 2.4s forwards}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.f.sel,.chart.sw svg{animation:none}.chart .trend{stroke-dashoffset:0!important;animation:none}.chart .pct{opacity:1;animation:none}}
.f .n{font:400 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f b{display:block;font:300 30px/1 var(--ui);color:var(--muted);margin-top:10px;letter-spacing:-.01em}
.f b.pos{color:var(--teal)}.f b.neg{color:var(--leak)}.f b.tan{color:var(--amber)}.f b.mid{color:var(--dim)}
.dots{display:flex;gap:3px;margin-top:9px}
.dots i{width:7px;height:7px;background:var(--edge2)}
.dots i.on{background:var(--dim)}
.dots.pos i.on{background:var(--teal)}.dots.neg i.on{background:var(--leak)}.dots.tan i.on{background:var(--amber)}
@media (max-width:700px){.fx{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.fx{grid-template-columns:repeat(2,1fr)}}

/* goal page additions */
.hero .side .tg{display:grid;grid-template-columns:auto auto;gap:4px 14px;font:400 12px/1.4 var(--mono);color:var(--dim)}
.hero .side .tg b{font-weight:400;color:var(--ink)}
.hero .side .tg .neg{color:var(--leak)}.hero .side .tg .pos{color:var(--teal)}
.tiles{grid-template-columns:repeat(5,1fr)}
.t{cursor:pointer}
.t.on{background:#0f1518;border-color:var(--edge2)}
.t.weak{border-top-color:var(--leak)}
.t .wk{font:400 9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--leak);margin-top:8px}

/* the levers grid */
.lv{margin-top:28px;border-top:1px solid var(--edge)}
.lv .row{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(5,minmax(0,1fr)) 78px;gap:0;align-items:stretch;border-bottom:1px solid var(--edge)}
.lv .row.h{border-bottom:1px solid var(--edge2)}
.lv .row.h > div{padding:12px 8px 8px;font:400 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .row.h > div.weak{color:var(--leak);box-shadow:inset 0 -2px 0 var(--leak)}
.lv .row.l{cursor:pointer;transition:background .18s}
.lv .row.l:hover{background:rgba(255,255,255,.02)}
.lv .row.l.on{background:#0f1518}
.lv .name{padding:14px 8px 12px 0;border-left:2px solid var(--edge2);padding-left:12px;min-width:0}
.lv .row.l.pos .name{border-left-color:var(--teal)}.lv .row.l.neg .name{border-left-color:var(--leak)}.lv .row.l.early .name{border-left-color:var(--amber)}
.lv .name b{display:block;font:400 16px/1.25 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .name span{display:block;font:400 10.5px/1 var(--mono);color:var(--muted);letter-spacing:.06em;margin-top:6px;white-space:nowrap}
.lv .name span em{font-style:normal;color:var(--dim)}
.lv .c{padding:12px 8px 10px;min-width:0;cursor:pointer;border:1px solid transparent;transition:background .18s,border-color .18s}
.lv .c:hover{background:rgba(255,255,255,.025)}
.lv .c.sel{background:rgba(255,255,255,.04);border-color:var(--edge2);animation:pop .32s cubic-bezier(.2,.9,.2,1)}
.lv .c b{display:block;font:300 26px/1 var(--ui);color:var(--muted);letter-spacing:-.01em}
.lv .c b.pos{color:var(--teal)}.lv .c b.neg{color:var(--leak)}.lv .c b.tan{color:var(--amber)}.lv .c b.mid{color:var(--dim)}
.lv .c .dots{margin-top:8px}
.lv .sum{padding:12px 0 10px 8px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px}
.lv .sum b{font:300 26px/1 var(--ui);letter-spacing:-.01em;color:var(--muted)}
.lv .sum b.pos{color:var(--teal)}.lv .sum b.neg{color:var(--leak)}
.lv .sum svg{width:14px;height:14px}
.lv .next{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr;padding:14px 0 14px 12px;border-left:2px solid var(--leak);margin-top:10px;align-items:center}
.lv .next .k{font:400 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lv .next b{font:400 16px/1.2 var(--ui);color:var(--leak)}
@media (max-width:700px){.lv .row{grid-template-columns:minmax(120px,1.2fr) repeat(5,minmax(0,1fr)) 60px}.lv .c b,.lv .sum b{font-size:18px}.lv .name b{font-size:14px}.tiles{grid-template-columns:repeat(5,1fr)}.t b{font-size:20px}}
.line{grid-template-columns:minmax(0,1fr) 150px 74px}
.line + .line{margin-top:14px}
</style>

<style>
/* ---- the Wire's additions to the mock. everything above is the mock's own stylesheet, unchanged ---- */

/* the goals: the rail as it was at c3ab42d, thin rows above the number */
.rail{margin-top:22px}
.tbl{width:100%;border-collapse:collapse;font:400 11px/1.4 var(--mono)}
.tbl td{height:48px;padding:11px 10px 11px 8px;border-bottom:1px solid var(--edge);vertical-align:middle;white-space:nowrap}
.tbl td:last-child{padding-right:0}
.tbl td.r{text-align:right}
.tbl td.nm{font:500 13px/1.2 var(--ui);max-width:220px;min-width:105px;overflow:hidden;text-overflow:ellipsis}
.tbl td.g{width:28px}
.tbl td svg{display:block;width:58px;height:26px;margin-left:auto}
.tbl td.g svg{width:12px;height:12px}
.tbl tr.row{cursor:pointer;outline:0}
.tbl tr.row:hover td{background:#171c1f}
.tbl tr.row:hover td.nm{color:var(--amber)}
.tbl tr.on td{background:#1b201f}
.tbl tr.on td:first-child{box-shadow:inset 2px 0 var(--amber)}
.tbl tr.on td.nm{color:var(--amber)}
.tbl tr.row:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

/* the levers grid holds as many measures as the goal has */
.lv .row{grid-template-columns:minmax(150px,1.4fr) repeat(var(--n,5),minmax(0,1fr)) 78px}
.lv.many .c b,.lv.many .sum b{font-size:20px}
.lv .end{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;color:var(--teal);cursor:pointer}
.lv .end:hover{color:var(--ink)}
.lv .end[disabled]{opacity:.35;cursor:default}
@media (max-width:700px){.lv .row{grid-template-columns:minmax(120px,1.2fr) repeat(var(--n,5),minmax(0,1fr)) 60px}.lv.many{overflow-x:auto}.lv.many .row{min-width:calc(180px + var(--n) * 48px)}.lv.many .c b,.lv.many .sum b{font-size:18px}}

/* a focused measure shows its rule */
.rules{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.rules:empty{display:none}
.rules button{background:none;border:1px solid var(--edge2);color:var(--muted);font:400 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:9px 11px;cursor:pointer}
.rules button:hover{color:var(--ink);border-color:var(--dim)}
.rules button[aria-pressed="true"]{color:var(--teal);border-color:var(--teal)}
.rules input{width:84px;background:none;border:0;border-bottom:1px solid var(--edge2);color:var(--ink);font:300 18px/1.2 var(--ui);padding:4px 0;margin-left:8px;border-radius:0}
.rules input:focus{border-bottom-color:var(--teal);outline:0}

/* the three lines */
.line select{background:var(--ground);border:0;border-bottom:1px solid var(--edge2);color:var(--dim);font:400 13px/1.2 var(--mono);padding:9px 0;width:100%;min-width:0;border-radius:0;color-scheme:dark}
.line select:focus{border-bottom-color:var(--teal);outline:0}
select:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
.line input[type=date]{color-scheme:dark}
.line.c4{grid-template-columns:minmax(0,1fr) 150px 150px 74px}
.line.new{grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr) 90px 74px}
.line .picks{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.line .picks button{padding:8px 10px;font:400 10px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.line .picks button:hover{color:var(--ink);border-color:var(--dim)}
.line .picks button[aria-pressed="true"]{color:var(--teal);border-color:var(--teal)}
.line .picks button.off{border-style:dashed}
.line button[disabled]{opacity:.35;cursor:default}
.line .bad,.line .bad:focus,.rules .bad,.rules .bad:focus{border-bottom-color:var(--leak)}
.line .picks.bad button{border-color:var(--leak)}
.err{font:400 11px/1.6 var(--mono);letter-spacing:.04em;color:var(--leak);margin:14px 0 0;min-height:1.6em}
@media (max-width:520px){.line.c4,.line.new{grid-template-columns:1fr 1fr}}
</style>

<div class="main">
  <div class="bar">
    <p class="eyebrow" id="eyebrow">YOU</p>
    <button class="out" id="out" type="button">sign out</button>
  </div>

  <div class="rail"><table class="tbl" id="tbl" aria-label="goals"></table></div>

  <div class="hero" id="hero"></div>
  <div class="tiles" id="tiles"></div>
  <div class="rules" id="rules"></div>
  <div class="chart"><svg id="c" viewBox="0 0 680 230" aria-label="the goal on the index scale with levers as ticks"></svg></div>

  <div class="lv" id="lv"></div>

  <form class="line" id="padf">
    <input id="pval" type="text" placeholder="82.1" autocomplete="off" spellcheck="false">
    <select id="pstock" aria-label="stock"></select>
    <input id="pname" type="text" placeholder="weight_kg" autocomplete="off" spellcheck="false" hidden>
    <input id="punit" type="text" placeholder="kg" autocomplete="off" spellcheck="false" hidden>
    <button id="padd" type="submit">add</button>
  </form>
  <form class="line c4" id="cmf">
    <input id="cwhat" type="text" placeholder="creatine" autocomplete="off" spellcheck="false">
    <input id="cfrom" type="date" aria-label="from">
    <input id="cto" type="date" aria-label="to">
    <button id="cadd" type="submit">add</button>
  </form>
  <form class="line c4" id="goalf">
    <input id="gname" type="text" placeholder="body" autocomplete="off" spellcheck="false">
    <select id="gtm" aria-label="target"></select>
    <input id="gtv" type="text" placeholder="84" autocomplete="off" spellcheck="false">
    <button id="gadd" type="submit">add</button>
    <div class="picks" id="gpicks"></div>
  </form>
  <p class="err" id="err"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="you-reader.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY = new Date().toISOString().slice(0, 10);
const MON = ['','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

// The mock's glyphs and its word for an index: 100 is your usual, ten points one step.
const UP = '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M6 2L11 10H1z" fill="#5fc4b4"/></svg>';
const DOWN = '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M6 10L1 2h10z" fill="#c9695c"/></svg>';
const FLAT = '<svg viewBox="0 0 12 12" width="12" height="12"><rect x="1" y="5" width="10" height="2" fill="#e6e3dc"/></svg>';
const word = r => r==null?{w:'',cls:''}:r>=110?{w:UP,cls:'pos'}:r<=90?{w:DOWN,cls:'neg'}:{w:FLAT,cls:''};
const COLS = ['#e6e3dc','#5fc4b4','#c9a25a','#8d959a','#7f8a90'];
const sgn = v => (v>=0?'+':'')+(Math.round(v*10)/10);
const num = v => Number.isInteger(v) ? String(v) : Math.abs(v) >= 100 ? String(Math.round(v)) : String(Math.round(v*100)/100);
// the pad's own name rule, the same as pad.html
const slug = s => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
function remember(m){ try { localStorage.setItem('wire.pad.metric', m); } catch (e) {} }
function remembered(){ try { return localStorage.getItem('wire.pad.metric'); } catch (e) { return null; } }

// ---- what the ledger says. every number below comes from you-reader.js ----
const YOU_ID = 'YOU';   // slugs are lower case, so no goal can take this id
let ALL = [], RULES = {}, COMMITS = [], GOALS = [], SERIES = {}, OWNED = [], YOU = [], LAST = {}, UNITS = {};
let SEL = YOU_ID, FOCUS = null, BAND = false, GPICK = new Set();   // FOCUS: { c, m } a commit and a measure, { c, m:null } a commit on the goal, { c:null, m } a measure
let D0 = 0, N = 0;   // the first day the chart can reach, as a day number, and how many days it holds
let RULING = false, ENDING = false;   // a rule row or an end row on its way: a double click writes one

async function load(){
  const [all, rules, commits, goals] = await Promise.all([readMetrics(db), readRules(db), readCommits(db), readGoals(db)]);
  const rows = all.length ? await readDays(db, all) : [];
  ALL = all; RULES = rules; COMMITS = commits; GOALS = goals;
  SERIES = rankSeries(rows, rules); OWNED = Object.keys(SERIES); YOU = etfSeries(SERIES, OWNED);
  LAST = {}; for (const r of rows) LAST[r.metric] = r;                // readDays is oldest first
  const { data: u, error: ue } = await db.from('events').select('metric, unit').eq('event_type', 'measurement').not('unit', 'is', null).order('occurred_at', { ascending: false }).limit(20000);
  if (ue) throw ue;
  UNITS = {}; for (const r of u) if (!(r.metric in UNITS)) UNITS[r.metric] = r.unit;   // newest first, so the latest unit wins
  // the last 90 days, reaching back further only to hold a reading or a commit's before
  const t = dayNum(TODAY); let lo = t - 89;
  for (const m of OWNED) lo = Math.min(lo, dayNum(SERIES[m][0].day));
  for (const c of COMMITS){ const s = dayNum(c.from), e = Math.min(dayNum(c.to || TODAY), t); lo = Math.min(lo, s - Math.max(2, e - s + 1)); }
  D0 = lo; N = t - lo + 1;
  if (!(SEL === YOU_ID || GOALS.some(g => g.id === SEL))) SEL = YOU_ID;
  if (FOCUS && FOCUS.c && !COMMITS.some(c => c.id === FOCUS.c)) FOCUS = null;
}
const dstr = n => new Date(n * 864e5).toISOString().slice(0, 10);
const arrOf = pts => { const a = new Array(N).fill(null); for (const p of pts){ const i = dayNum(p.day) - D0; if (i >= 0 && i < N) a[i] = p.rank; } return a; };
// YOU is the goal made of every declared stock
const youGoal = () => ({ id: YOU_ID, name: 'YOU', measures: OWNED, target: null });
const cur = () => SEL === YOU_ID ? youGoal() : GOALS.find(g => g.id === SEL);
const pointsOf = g => g.id === YOU_ID ? YOU : goalSeries(g, SERIES);
const say = m => { $('err').textContent = m || ''; };
// the reader draws no day on which a scored measure is stale, so while one is stale today the index is silent too
const silent = g => g.measures.some(m => SERIES[m] && dayNum(TODAY) - dayNum(SERIES[m][SERIES[m].length-1].day) > STALE_DAYS);

function render(){ const g = cur(); $('eyebrow').textContent = g.name; drawRail(); drawHero(g); draw(); drawLines(); }
function draw(){ const g = cur(); drawTiles(g); drawRules(g); drawLevers(g); drawChart(g); }

// ---- the rail: YOU, then every goal. a name, the index, a glyph, the line ----
function moveOf(pts){ if(pts.length<8) return null; return Math.round((pts[pts.length-1].rank-pts[pts.length-8].rank)*10)/10; }
function spark(pts){ const a=pts.slice(-45); if(a.length<3) return '<svg viewBox="0 0 60 28"></svg>';
  const v=a.map(p=>p.rank); let lo=Math.min(...v,100),hi=Math.max(...v,100); const span=(hi-lo)||1; const w=60,h=28;
  const d=a.map((p,i)=>(i?'L':'M')+(i*w/(a.length-1)).toFixed(1)+' '+(2+(hi-p.rank)*(h-4)/span).toFixed(1)).join(' ');
  const m=moveOf(pts); const col=(m!=null&&m<0)?'#c9695c':'#c9a25a';
  return `<svg viewBox="0 0 ${w} ${h}"><line x1="0" y1="${(2+(hi-100)*(h-4)/span).toFixed(1)}" x2="${w}" y2="${(2+(hi-100)*(h-4)/span).toFixed(1)}" stroke="#2c363d" stroke-dasharray="2 3"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/></svg>`; }
function drawRail(){
  const row = (g, pts) => { const p = silent(g) ? null : pts[pts.length-1], w = word(p ? p.rank : null);
    return `<tr class="row${g.id === SEL ? ' on' : ''}" data-id="${esc(g.id)}" tabindex="0"><td class="nm">${esc(g.name)}</td><td class="r">${p ? p.rank : '&#183;'}</td><td class="g">${w.w}</td><td>${spark(pts)}</td></tr>`; };
  $('tbl').innerHTML = row(youGoal(), YOU) + GOALS.map(g => row(g, goalSeries(g, SERIES))).join('');
}
function pickGoal(id){ SEL = id; FOCUS = null; BAND = false; say(''); fillGoalLine(); render(); }

// ---- hero ----
function drawHero(g){
  const pts = pointsOf(g), last = silent(g) ? null : pts[pts.length-1], w = word(last ? last.rank : null);
  let tg = '';
  if (g.target){ const t = g.target, unit = UNITS[t.metric] ? ' ' + esc(UNITS[t.metric]) : '', lr = LAST[t.metric];
    const shown = t.value != null ? num(t.value) : `${num(t.lo)}&#8211;${num(t.hi)}`;
    if (!lr) tg = `<span>${shown}${unit}</span><b>&#183;</b><span></span><b>empty</b>`;
    else { const now = Number(lr.mean), age = dayNum(TODAY) - dayNum(lr.day);
      const gap = Math.round((t.value != null ? now - t.value : now < t.lo ? now - t.lo : now > t.hi ? now - t.hi : 0) * 100) / 100;
      const g2 = age > STALE_DAYS ? '<b>stale</b>' : `<b class="${gap === 0 ? 'pos' : 'neg'}">${gap === 0 ? '0' : (gap>0?'+':'')+num(gap)}</b>`;
      tg = `<span>${shown}${unit}</span><b>${num(now)}</b><span>${lr.day.slice(5)}</span>${g2}`; } }
  $('hero').innerHTML = `<div class="big ${w.cls}">${last ? last.rank : '&#183;'}</div>
   <div class="side"><div class="l">${esc(g.name)}</div><div class="w ${w.cls}">${w.w}</div>${tg ? `<div class="tg">${tg}</div>` : ''}</div>`;
}

// ---- measures, listed ----
function drawTiles(g){
  const weak = weakPoint(g, SERIES), today = dayNum(TODAY);
  $('tiles').innerHTML = g.measures.map(m => { const pts = SERIES[m] || [], last = pts[pts.length-1], w = word(last ? last.rank : null), lr = LAST[m];
    const p = arrOf(pts).slice(-30), vv = p.filter(v => v != null), lo = Math.min(...vv), hi = Math.max(...vv);
    let path = '', on = false; p.forEach((v,j) => { if (v == null){ on = false; return; } const x = j*(120/29), y = 24-((v-lo)/((hi-lo)||1))*22; path += (on?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; on = true; });
    const sel = FOCUS && !FOCUS.c && FOCUS.m === m, isWeak = weak && weak.metric === m;
    const state = !SERIES[m] ? (RULES[m] && RULES[m].kind === 'ignore' ? 'ignored' : lr ? 'unscored' : 'empty') : today - dayNum(last.day) > STALE_DAYS ? 'stale' : '';
    return `<div class="t ${w.cls} ${sel?'on':''} ${isWeak?'weak':''}" data-m="${esc(m)}"><div class="n">${esc(m)}</div><b>${lr ? num(Number(lr.mean)) : '&#183;'}${lr && UNITS[m] ? `<small>${esc(UNITS[m])}</small>` : ''}</b>
      <div class="w">${state ? `<span style="font:400 10px/1 var(--mono);color:var(--muted)">${state}</span>` : w.w}</div>
      ${vv.length?`<svg viewBox="0 0 120 26" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="${w.cls==='pos'?'#5fc4b4':w.cls==='neg'?'#c9695c':'#5c656b'}" stroke-width="1.4"/></svg>`:`<svg viewBox="0 0 120 26"></svg>`}
      ${isWeak?'<div class="wk">weak</div>':''}</div>`; }).join('');
}
// the rule of the focused measure: up, down, band, ignore. writeRule, the same row the rules have always been
function drawRules(g){
  const box = $('rules'), m = FOCUS && !FOCUS.c && g.measures.includes(FOCUS.m) ? FOCUS.m : null;
  if (!m){ box.innerHTML = ''; return; }
  const r = RULES[m], k = r && r.kind, b = kind => `<button type="button" data-k="${kind}" aria-pressed="${k === kind}">${kind}</button>`;
  box.innerHTML = b('up') + b('down') + b('band') + b('ignore') + (BAND ? `<input id="lo" type="number" step="any" aria-label="low" value="${r && r.lo != null ? r.lo : ''}"><input id="hi" type="number" step="any" aria-label="high" value="${r && r.hi != null ? r.hi : ''}"><button type="button" data-k="save">set</button>` : '');
  box.dataset.m = m;
}
async function setRule(m, kind){
  if (kind === 'band'){ if (!BAND){ BAND = true; drawRules(cur()); } const el = $('lo'); if (el) el.focus(); return; }
  let rule = { kind };
  if (kind === 'save'){ const loEl = $('lo'), hiEl = $('hi'), ls = loEl.value.trim(), hs = hiEl.value.trim(), lo = Number(ls), hi = Number(hs);
    if (!ls || !Number.isFinite(lo)){ bad(loEl); return; }
    if (!hs || !Number.isFinite(hi) || hi <= lo){ bad(hiEl); return; }
    rule = { kind: 'band', lo, hi }; }
  else if (RULES[m] && RULES[m].kind === kind) return;          // already the rule, nothing to write
  if (RULING) return;
  RULING = true;
  try { const { error } = await writeRule(db, m, rule); if (error){ say(error.message); return; }
    BAND = false; say(''); await load(); render(); }
  finally { RULING = false; }
}

// ---- the levers: every commit against every measure, each cell testCommit's ----
const vcls = t => t.verdict === 'finding' ? (t.effect > 0 ? 'pos' : 'neg') : t.verdict === 'tangled' ? 'tan' : t.verdict === 'no finding' ? 'mid' : t.verdict === 'early' ? 'early' : '';
const vdots = t => t.verdict === 'finding' || t.verdict === 'tangled' ? 3 : t.verdict === 'no finding' ? 1 : 0;
function drawLevers(g){
  const box = $('lv'), ms = g.measures, weak = weakPoint(g, SERIES), gp = pointsOf(g);
  box.style.setProperty('--n', Math.max(1, ms.length)); box.classList.toggle('many', ms.length > 5);
  let h = `<div class="row h"><div></div>${ms.map(m => `<div class="${weak && weak.metric === m ? 'weak' : ''}">${esc(m)}</div>`).join('')}<div></div></div>`;
  h += COMMITS.map(c => { const tests = ms.map(m => SERIES[m] ? testCommit(SERIES[m], c, COMMITS, TODAY) : null), all = testCommit(gp, c, COMMITS, TODAY);
    const rowCls = all.verdict === 'finding' ? (all.effect > 0 ? 'pos' : 'neg') : (all.verdict === 'early' || tests.some(t => t && t.verdict === 'early')) ? 'early' : '';
    const on = FOCUS && FOCUS.c === c.id;
    return `<div class="row l ${rowCls} ${on?'on':''}" data-c="${esc(c.id)}">
      <div class="name"><b>${esc(c.name)}</b><span>${c.from.slice(5)} &#8594; ${c.to ? c.to.slice(5) : on ? `<button type="button" class="end" data-end="${esc(c.id)}">end</button>` : 'now'} &#183; <em>${c.days} d</em></span></div>
      ${tests.map((t,j) => { const m = ms[j], sel = on && FOCUS.m === m, cl = t ? vcls(t) : '', n = t ? vdots(t) : 0;
        const val = !t ? '&#183;' : t.verdict === 'early' ? `<small style="font:400 11px/1 var(--mono)">${t.needs} d</small>` : Number.isFinite(t.effect) ? sgn(t.effect) : '&#183;';
        return `<div class="c ${sel?'sel':''}" data-m="${esc(m)}"><b class="${cl}">${val}</b><div class="dots ${cl}"><i class="${n>=1?'on':''}"></i><i class="${n>=2?'on':''}"></i><i class="${n>=3?'on':''}"></i></div></div>`; }).join('')}
      <div class="sum">${all.verdict === 'finding' ? `<b class="${all.effect>=0?'pos':'neg'}">${sgn(all.effect)}</b>${all.effect>=0?UP:DOWN}` : '<b>&#183;</b>'}</div>
    </div>`; }).join('');
  if (weak) h += `<div class="next"><div class="k">next</div><b>${esc(weak.metric)} &#183; ${weak.rank}</b></div>`;
  box.innerHTML = h;
}

// ---- chart ----
function drawChart(g){
  const W=680,H=230,L=30,R=8,T=12,B=34, today = N-1;
  let i0 = Math.max(0, today-89), i1 = today, lo = 80, hi = 120, f = -1;
  const fm = FOCUS && FOCUS.m && SERIES[FOCUS.m] ? FOCUS.m : null;
  const pts = fm ? SERIES[fm] : pointsOf(g), line = arrOf(pts);
  const col = fm ? COLS[Math.max(0, g.measures.indexOf(fm)) % COLS.length] : '#e6e3dc';
  const fc = FOCUS && FOCUS.c ? COMMITS.find(c => c.id === FOCUS.c) : null;
  if (fc){ f = dayNum(fc.from) - D0; const tEnd = Math.min(dayNum(fc.to || TODAY), dayNum(TODAY)) - D0; const dur = Math.max(2, tEnd-f+1); i0 = Math.max(0, f-dur); i1 = Math.min(today, Math.max(tEnd, f)); }
  { const vals = line.slice(i0,i1+1).filter(v=>v!=null); if (vals.length){ lo = Math.floor((Math.min(...vals)-3)/5)*5; hi = Math.ceil((Math.max(...vals)+3)/5)*5; } }
  const x = i => L + (i-i0)*(W-L-R)/Math.max(1,i1-i0);
  const y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  let s = `<defs><linearGradient id="gr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient><clipPath id="box"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}"/></clipPath></defs><g clip-path="url(#box)">`;
  if (fc) s += `<rect x="${x(f)}" y="${T}" width="${Math.max(0, x(i1)-x(f))}" height="${H-T-B}" fill="#c9a25a" opacity=".06"/>`;
  const step = (hi-lo) > 40 ? 10 : 5; let ylab='';
  for (let v=lo; v<=hi; v+=step){ s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===100?'#2c3a42':'#171c20'}" stroke-width="1"/>`; ylab += `<text x="0" y="${y(v)+3}" font-family="JetBrains Mono" font-size="8" fill="#5c656b">${v}</text>`; }
  let area='', run=null; for (let i=i0;i<=i1+1;i++){ const v = i<=i1 ? line[i] : null;
    if (v!=null){ if (run==null){ run=i; area += `M${x(i).toFixed(1)} ${H-B} `; } area += `L${x(i).toFixed(1)} ${y(v).toFixed(1)} `; } else if (run!=null){ area += `L${x(i-1).toFixed(1)} ${H-B} Z `; run=null; } }
  if (area) s += `<path d="${area}" fill="url(#gr)"/>`;
  COMMITS.forEach(d => { const i = dayNum(d.from) - D0; if (i<i0||i>i1) return; const on = fc && fc.id === d.id;
    s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B+6}" stroke="#c9a25a" stroke-width="${on?1.5:1}" stroke-dasharray="${on?'':'2 3'}" opacity="${on?1:(fc?.35:.9)}"/>`; });
  let path='', on=false; for (let i=i0;i<=i1;i++){ const v=line[i]; if (v==null){on=false;continue;} path += (on?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; on=true; }
  s += `<path d="${path}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
  line.forEach((v,i)=>{ if (v==null||i<i0||i>i1) return; if ((i===0||line[i-1]==null)&&(i===N-1||line[i+1]==null)) s += `<circle cx="${x(i)}" cy="${y(v)}" r="1.6" fill="${col}"/>`; });
  let last=i1; while (last>i0 && line[last]==null) last--; if (line[last]!=null) s += `<circle cx="${x(last)}" cy="${y(line[last])}" r="3" fill="${col}"/>`;
  if (fc){
    // the before and during means and the number are testCommit's; the gates stay, so an early test draws none of them
    const r = testCommit(pts, fc, COMMITS, TODAY);
    if (r.verdict === 'finding' || r.verdict === 'no finding' || r.verdict === 'tangled'){
      const c = r.verdict === 'finding' ? (r.effect > 0 ? '#5fc4b4' : '#c9695c') : r.verdict === 'tangled' ? '#c9a25a' : '#e6e3dc';
      s += `<line x1="${x(i0)}" x2="${x(f)}" y1="${y(r.beforeMean)}" y2="${y(r.beforeMean)}" stroke="#8d959a" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="${x(f)}" x2="${x(i1)}" y1="${y(r.duringMean)}" y2="${y(r.duringMean)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="${x(f)}" x2="${x(f)}" y1="${y(r.beforeMean)}" y2="${y(r.duringMean)}" stroke="${c}" stroke-width="1.5"/>`;
      // the trend through the days it ran: a drawn shape only, the number beside it is testCommit's
      let n=0,sx=0,sy=0,sxx=0,sxy=0; for (let i=f;i<=i1;i++){ const v=line[i]; if (v==null) continue; n++; sx+=i; sy+=v; sxx+=i*i; sxy+=i*v; }
      if (n>=MIN_DAYS && n*sxx-sx*sx!==0){ const m=(n*sxy-sx*sy)/(n*sxx-sx*sx), b=(sy-m*sx)/n; const y1=y(m*f+b), y2=y(m*i1+b); const len=Math.hypot(x(i1)-x(f), y2-y1);
        s += `<line class="trend" x1="${x(f)}" y1="${y1.toFixed(1)}" x2="${x(i1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="2.2" stroke-linecap="round" style="stroke-dasharray:${len.toFixed(1)};stroke-dashoffset:${len.toFixed(1)}"/>`; }
      s += `<text class="pct" x="${W-R-8}" y="${T+30}" text-anchor="end" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-weight="300" font-size="32" letter-spacing="-.5" fill="${c}">${sgn(r.effect)}</text><text x="${W-R-8}" y="${T+44}" text-anchor="end" font-family="JetBrains Mono" font-size="8" fill="#5c656b" letter-spacing="1.5">${r.before} &#183; ${r.during}</text>`;
    }
  }
  s += `</g>${ylab}`;
  if (!fc){ for (let i=i0;i<=i1;i++){ const d = dstr(D0+i), first = d.endsWith('-01');
      if (!first && i !== i0) continue;
      if (first && x(i) + 21 > W) continue;   // too near the edge to be read
      if (!first){ let soon = false; for (let k=1;k<=10&&i+k<=i1;k++) if (dstr(D0+i+k).endsWith('-01')) soon = true; if (soon) continue; }
      s += `<text x="${x(i)}" y="${H-2}" font-family="JetBrains Mono" font-size="8" fill="#5c656b" letter-spacing="2">${MON[+d.slice(5,7)]}</text>`; } }
  else s += `<text x="${L}" y="${H-2}" font-family="JetBrains Mono" font-size="8" fill="#5c656b" letter-spacing="1">${dstr(D0+i0)}</text><text x="${W-R}" y="${H-2}" text-anchor="end" font-family="JetBrains Mono" font-size="8" fill="#5c656b" letter-spacing="1">${dstr(D0+i1)}</text>`;
  const svg = $('c'); svg.innerHTML = s;
  const box = svg.parentElement; box.classList.remove('sw'); void box.offsetWidth; box.classList.add('sw');
}

// ---- clicks, as the mock: a cell focuses that commit and measure, a row the goal, a tile the measure, anywhere else returns ----
document.addEventListener('click', async e => {
  const end = e.target.closest('[data-end]');
  if (end){ if (ENDING) return; ENDING = true; end.disabled = true;
    try { if (await endCommit(end.dataset.end)){ await load(); render(); } else end.disabled = false; } finally { ENDING = false; }
    return; }
  const rule = e.target.closest('#rules button[data-k]');
  if (rule){ setRule($('rules').dataset.m, rule.dataset.k); return; }
  if (e.target.closest('.line, #rules, #out')) return;
  const pick = e.target.closest('#tbl tr.row');
  if (pick){ pickGoal(pick.dataset.id); return; }
  const cell = e.target.closest('.c'); const row = e.target.closest('.row.l'); const tile = e.target.closest('.t');
  if (row){ const c = row.dataset.c, m = cell ? cell.dataset.m : null; FOCUS = (FOCUS && FOCUS.c === c && FOCUS.m === m) ? null : { c, m }; }
  else if (tile){ const m = tile.dataset.m; FOCUS = (FOCUS && !FOCUS.c && FOCUS.m === m) ? null : { c: null, m }; }
  else if (!FOCUS) return;
  else FOCUS = null;
  BAND = false; draw();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && FOCUS){ FOCUS = null; BAND = false; draw(); } });
$('tbl').addEventListener('keydown', e => { const r = e.target.closest('tr.row'); if (r && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); pickGoal(r.dataset.id); } });

// ---- the three lines ----
// a field that is wrong turns red until it is changed
function bad(...els){ for (const el of els){ el.classList.add('bad'); const off = () => el.classList.remove('bad'); for (const ev of ['input','change','click']) el.addEventListener(ev, off, { once: true }); } if (els[0].focus) els[0].focus(); }
function drawLines(){
  const ps = $('pstock'), r = remembered(), want = ps.dataset.ready ? ps.value : (ALL.includes(r) ? r : (ALL[0] || ''));
  ps.innerHTML = ALL.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') + `<option value="">+</option>`;
  ps.value = ALL.includes(want) ? want : ''; ps.dataset.ready = '1'; padNew();
  const gt = $('gtm'), tw = gt.value;
  gt.innerHTML = `<option value="">none</option>` + ALL.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join(''); gt.value = ALL.includes(tw) ? tw : '';
  drawPicks(); if (!$('cfrom').value) $('cfrom').value = TODAY;
}
function padNew(){ const fresh = $('pstock').value === ''; $('pname').hidden = !fresh; $('punit').hidden = !fresh; $('padf').classList.toggle('new', fresh); }
$('pstock').onchange = padNew;
// every stock, scored ones first
function drawPicks(){
  const names = [...new Set([...ALL, ...GPICK])].sort((a,b) => (!SERIES[a]) - (!SERIES[b]) || a.localeCompare(b));
  $('gpicks').innerHTML = names.map(m => `<button type="button" data-m="${esc(m)}" class="${SERIES[m] ? '' : 'off'}" aria-pressed="${GPICK.has(m)}">${esc(m)}</button>`).join('');
  // flipped in place: a redraw would take the button out of the page before its click reaches the document
  $('gpicks').querySelectorAll('button').forEach(b => b.onclick = () => { const m = b.dataset.m; if (GPICK.has(m)) GPICK.delete(m); else GPICK.add(m); b.setAttribute('aria-pressed', GPICK.has(m)); });
}
// the goal line holds the goal on screen, so declaring it again is one edit and one click
function fillGoalLine(){ drawLines(); for (const id of ['gname', 'gtm', 'gtv', 'gpicks']) $(id).classList.remove('bad'); const g = SEL === YOU_ID ? null : cur();
  $('gname').value = g ? g.name : ''; $('gtm').value = g && g.target ? g.target.metric : '';
  $('gtv').value = g && g.target ? (g.target.value != null ? String(g.target.value) : `${g.target.lo} to ${g.target.hi}`) : '';
  GPICK = new Set(g ? g.measures : []); drawPicks(); }

// the pad's line. a number is a reading, anything else is a note. the rows are pad.html's rows
async function lastUnit(metric){
  const { data, error } = await db.from('events').select('value, unit, occurred_at').eq('metric', metric).eq('event_type', 'measurement').not('value', 'is', null).order('occurred_at', { ascending: false }).limit(7);
  if (error){ say(error.message); return undefined; }
  return (data.find(r => r.unit) || {}).unit || null;
}
$('padf').addEventListener('submit', async e => { e.preventDefault(); say('');
  const raw = $('pval').value.trim(); if (!raw){ bad($('pval')); return; }
  $('padd').disabled = true;
  const n = Number(raw), isNumber = Number.isFinite(n);
  let metric = $('pstock').value, unit = null;
  if (metric === ''){ metric = slug($('pname').value); if (!metric){ $('padd').disabled = false; bad($('pname')); return; } unit = $('punit').value.trim() || null; }
  else { unit = await lastUnit(metric); if (unit === undefined){ $('padd').disabled = false; return; } }
  const row = isNumber
    ? { occurred_at: new Date().toISOString(), metric, value: n, unit, source: 'pad' }
    : { occurred_at: new Date().toISOString(), metric, event_type: 'note', value: null, source: 'you', context: { text: raw } };
  const { error } = await db.from('events').insert(row); $('padd').disabled = false;
  if (error){ say(error.message); return; }
  $('pval').value = ''; $('pname').value = ''; $('punit').value = ''; remember(metric);
  await load(); render(); $('pstock').value = ALL.includes(metric) ? metric : ''; padNew();
});

// the commit line. a start row, and an end row if it has ended. the rows are commit.html's rows
async function endCommit(id, to){
  const day = to || TODAY;
  const { error } = await db.from('events').insert({ occurred_at: new Date(day + 'T12:00:00Z').toISOString(), metric: id, event_type: 'commit_end', source: 'you', context: { to: day } });
  if (error){ say(error.message); return false; }
  return true;
}
$('cmf').addEventListener('submit', async e => { e.preventDefault(); say('');
  const name = $('cwhat').value.trim(), from = $('cfrom').value, to = $('cto').value;
  if (!name){ bad($('cwhat')); return; }
  if (!from || from > TODAY){ bad($('cfrom')); return; }
  if (to && to < from){ bad($('cto')); return; }
  const id = slugCommit(name);
  if (COMMITS.some(c => c.id === id)){ bad($('cwhat')); say('exists'); return; }
  $('cadd').disabled = true;
  const { error } = await db.from('events').insert({ occurred_at: new Date(from + 'T12:00:00Z').toISOString(), metric: id, event_type: 'commit', source: 'you', context: { name, from } });
  if (error){ $('cadd').disabled = false; say(error.message); return; }
  if (to){ const ok = await endCommit(id, to); if (!ok){ $('cadd').disabled = false; await load(); render(); return; } }   // the start row is in, so a second add says exists
  $('cadd').disabled = false; $('cwhat').value = ''; $('cto').value = ''; $('cfrom').value = TODAY;
  await load(); render();
});

// the goal line. a name, a target on one stock if there is one, and the stocks it is made of
function parseTarget(){
  const metric = $('gtm').value, s = $('gtv').value.trim();
  if (!metric && !s) return { target: null };
  if (!metric) return { bad: $('gtm') };
  if (!s) return { bad: $('gtv') };
  const band = s.match(/^(-?\d+(?:\.\d+)?)\s*(?:to|–|-)\s*(-?\d+(?:\.\d+)?)$/);
  if (band){ const lo = Number(band[1]), hi = Number(band[2]); return hi > lo ? { target: { metric, lo, hi } } : { bad: $('gtv') }; }
  const v = Number(s); return Number.isFinite(v) ? { target: { metric, value: v } } : { bad: $('gtv') };
}
$('goalf').addEventListener('submit', async e => { e.preventDefault(); say('');
  const name = $('gname').value.trim(); if (!name || !slug(name)){ bad($('gname')); return; }
  const measures = [...GPICK]; if (!measures.length){ bad($('gpicks')); return; }
  const p = parseTarget(); if (p.bad){ bad(p.bad); return; }
  $('gadd').disabled = true;
  try { const { error } = await writeGoal(db, name, measures, p.target);
    if (error){ say(error.message); return; }
    SEL = slugCommit(name); FOCUS = null; BAND = false; await load(); fillGoalLine(); render(); }
  finally { $('gadd').disabled = false; }   // held through the reload, so the same goal is not written twice
});

$('out').onclick = async () => { await db.auth.signOut(); location.href = 'index.html'; };
db.auth.getSession().then(async ({ data }) => {
  if (!data.session){ location.href = 'index.html'; return; }
  try {
    // right after sign in the database can see a fresh token a second early and refuse it. once more, a moment later
    try { await load(); } catch (e) { if (!/jwt/i.test(e.message || '')) throw e; await new Promise(r => setTimeout(r, 1500)); await load(); }
    fillGoalLine(); render();
  } catch (e) { say(e.message || String(e)); }
});
</script>
