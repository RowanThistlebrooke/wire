<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>you</title>
<style>
  body { background:#0e1113; color:#e8e4dc; font:16px/1.5 system-ui; margin:0;
         padding:24px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase;
       color:#69737a; margin:28px 0 12px; font-weight:600; }
  .n { color:#69737a; font-size:13px; margin:0 0 24px; }
  .card { border:1px solid #252d33; border-radius:10px; padding:16px; margin-bottom:16px; }
  .card.you { border-color:#3a4a47; }
  .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .name { font-weight:600; font-family:ui-monospace,Menlo,monospace; font-size:14px; }
  .rank { font-size:24px; font-variant-numeric:tabular-nums; }
  .big { display:flex; align-items:baseline; gap:10px; }
  .real { color:#69737a; font-size:13px; font-variant-numeric:tabular-nums;
          font-family:ui-monospace,Menlo,monospace; }
  .move { font-variant-numeric:tabular-nums; }
  .move.up { color:#4bb5a6; } .move.dn { color:#d1584a; } .move.flat { color:#69737a; }
  .sub { color:#69737a; font-size:12px; display:flex; justify-content:space-between;
         align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .stale { color:#d9a441; }
  svg { width:100%; height:90px; display:block; }
  .rules { display:flex; gap:4px; flex-wrap:wrap; }
  .rules button { font:inherit; font-size:11px; padding:4px 8px; border-radius:5px;
                  border:1px solid #252d33; background:transparent; color:#69737a; cursor:pointer; }
  .rules button:hover { color:#e8e4dc; border-color:#39434a; }
  .rules button[aria-pressed="true"] { color:#4bb5a6; border-color:#1e3b37; background:#0f1f1d; }
  .band { display:flex; gap:6px; align-items:center; margin-top:8px; }
  .band input { width:70px; font:inherit; font-size:12px; padding:5px 7px; border-radius:5px;
                background:#151a1d; color:#e8e4dc; border:1px solid #252d33; }
  .band span { color:#69737a; font-size:12px; }
  .row { padding:12px 0; border-bottom:1px solid #1b2227; }
  .row .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row .name { flex:1; min-width:130px; }
  .lane { position:relative; height:26px; margin-bottom:6px; }
  .bar { position:absolute; height:22px; top:2px; border-radius:5px; padding:0 9px;
         font:600 11px/22px ui-monospace,Menlo,monospace; white-space:nowrap;
         overflow:hidden; background:#241c10; color:#d9a441; border:1px solid #4a3a1c; }
  .bar.live { background:#d9a441; color:#1a1206; border-color:#d9a441; }
  .axis { display:flex; justify-content:space-between; color:#69737a;
          font-size:11px; border-top:1px solid #252d33; padding-top:8px; margin-top:6px; }
  .foot { margin-top:28px; display:flex; gap:16px; flex-wrap:wrap; }
  a { color:#69737a; font-size:13px; }
  .err { color:#d1584a; font-size:13px; }
</style>

<h1>you</h1>
<p class="n" id="note">reading...</p>
<p class="n" style="margin-top:-16px">100 is the person you were across your first thirty readings. Ten points is one step of your own ordinary variation. There is no ceiling.</p>
<div id="out"></div>
<div id="rest"></div>

<div class="foot"><a href="you.html">you</a><a href="pad.html">pad</a><a href="commit.html">commits</a><a href="test.html">did it work</a><a href="import.html">import</a></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="you-reader.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
let OPEN = null;   // which metric has its band editor open

function line(points, colour, key, mark) {
  if (points.length < 2) return '<svg></svg>';
  const w = 520, h = 90, pad = 6;
  const vals = points.map(p => p[key]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  // Keep the 100 line inside the drawing, so above and below always read.
  if (mark !== undefined) { lo = Math.min(lo, mark); hi = Math.max(hi, mark); }
  const span = (hi - lo) || 1;
  const step = (w - pad * 2) / (points.length - 1);
  const y = v => h - pad - ((v - lo) / span) * (h - pad * 2);
  const d = points.map((p, i) => `${pad + i * step},${y(p[key])}`).join(' ');
  const base = mark === undefined ? '' :
    `<line x1="${pad}" y1="${y(mark)}" x2="${w - pad}" y2="${y(mark)}"
           stroke="#2b3439" stroke-width="1" stroke-dasharray="3 4"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="over time">
    ${base}
    <polyline points="${d}" fill="none" stroke="${colour}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// The move over the last seven readings. People read the change first.
function moveOf(points) {
  if (points.length < 8) return '';
  const now = points[points.length - 1].rank;
  const then = points[points.length - 8].rank;
  const d = Math.round((now - then) * 10) / 10;
  if (d === 0) return '<span class="move flat">flat this week</span>';
  return `<span class="move ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '↑' : '↓'}${Math.abs(d)} this week</span>`;
}

const label = r => !r ? '' :
  r.kind === 'band' ? `best ${r.lo} to ${r.hi}` : r.kind;

function ruleButtons(metric, rule) {
  const k = rule && rule.kind;
  const b = (kind, text) =>
    `<button data-m="${metric}" data-k="${kind}" aria-pressed="${k === kind}">${text}</button>`;
  let html = `<span class="rules">${b('up', 'up')}${b('down', 'down')}` +
             `${b('band', 'best between')}${b('ignore', 'ignore')}</span>`;
  if (OPEN === metric) {
    html += `<div class="band">
      <span>best between</span>
      <input id="lo" type="number" step="any" value="${rule && rule.lo !== undefined ? rule.lo : ''}">
      <span>and</span>
      <input id="hi" type="number" step="any" value="${rule && rule.hi !== undefined ? rule.hi : ''}">
      <button data-m="${metric}" data-k="save">set</button>
    </div>`;
  }
  return html;
}

// A commit has no line of its own. It is a span, drawn under everything else.
function lanes(commits, you) {
  if (!commits.length || you.length < 2) return '';
  const a = dayNum(you[0].day), b = dayNum(you[you.length - 1].day);
  const span = (b - a) || 1;
  const today = dayNum(new Date().toISOString().slice(0, 10));
  const pc = d => Math.max(0, Math.min(100, ((d - a) / span) * 100));
  const bars = commits.map(c => {
    const s0 = pc(dayNum(c.from)), s1 = pc(Math.min(dayNum(c.to || today), b));
    const w = Math.max(6, s1 - s0);
    return `<div class="lane"><div class="bar ${c.to ? '' : 'live'}"
      style="left:${s0}%;width:${w}%">${c.name}</div></div>`;
  }).join('');
  return `<h2>what you did</h2>${bars}
    <div class="axis"><span>${you[0].day}</span><span>${you[you.length - 1].day}</span></div>`;
}

// Your real reading from day one. Your index from day fourteen.
function card(name, points, colour, right, cls, note) {
  const n = points.length;
  const ready = n >= 14;
  const p = points[n - 1];
  const big = !p ? '—' : ready ? p.rank : (p.value !== undefined ? p.value : '—');
  // The index is the comparison. The reading is the truth. Show both.
  const real = ready && p && p.value !== undefined
    ? `<span class="real">${p.value}</span>` : '';
  const foot = ready ? `${n} days` : `${n} / 14 days to an index`;
  return `<div class="card ${cls || ''}">
    <div class="top">
      <span class="name">${name}</span>
      <span class="big">${real}<span class="rank">${big}</span></span>
    </div>
    ${line(points, colour, ready ? 'rank' : 'value', ready ? 100 : undefined)}
    <div class="sub"><span>${foot}${note ? ' · ' + note : ''} ${ready ? moveOf(points) : ''}</span>${right || ''}</div>
  </div>`;
}

async function set(metric, kind) {
  if (kind === 'band' && OPEN !== metric) { OPEN = metric; render(); return; }
  let rule = { kind };
  if (kind === 'save') {
    const lo = Number(document.getElementById('lo').value);
    const hi = Number(document.getElementById('hi').value);
    if (!isFinite(lo) || !isFinite(hi) || hi <= lo) {
      note.className = 'err'; note.textContent = 'Give a low and a high, high bigger.'; return;
    }
    rule = { kind: 'band', lo, hi };
  }
  OPEN = null;
  const { error } = await writeRule(db, metric, rule);
  if (error) { note.className = 'err'; note.textContent = error.message; return; }
  render();
}

function wire(el) {
  el.querySelectorAll('button[data-m]').forEach(b =>
    b.onclick = () => set(b.dataset.m, b.dataset.k));
}

async function render() {
  const [all, rules, commits] = await Promise.all(
    [readMetrics(db), readRules(db), readCommits(db)]);
  const rows = await readDays(db, all);
  const series = rankSeries(rows, rules);
  const owned = Object.keys(series);

  const today = dayNum(new Date().toISOString().slice(0, 10));
  const staleOf = m => {
    const pts = series[m];
    const age = today - dayNum(pts[pts.length - 1].day);
    return age > STALE_DAYS ? `stale, ${age} days old` : '';
  };

  let html = '';
  if (owned.length) {
    const you = etfSeries(series, owned);
    const cov = coverage(series, owned);
    const skipped = cov.days - cov.drawn;
    html += card('YOU', you, '#d9a441',
      `<span>${owned.length} stocks</span>`, 'you',
      skipped ? `${skipped} days not drawn, something was stale` : 'all days complete');
    html += lanes(commits, you);
    html += '<h2>your stocks</h2>';
    for (const m of owned) {
      html += card(m, series[m], '#4bb5a6', ruleButtons(m, rules[m]), '',
                   `<span class="stale">${staleOf(m)}</span>`);
    }
  }
  out.innerHTML = html;
  wire(out);

  const undecided = all.filter(m => !(m in rules));
  const ignored = Object.keys(rules).filter(m => rules[m].kind === 'ignore');
  const block = (title, list, rulesFor) => !list.length ? '' :
    `<h2>${title}</h2>` + list.map(m => `<div class="row">
       <div class="head"><span class="name">${m}</span></div>
       ${ruleButtons(m, rulesFor ? rules[m] : null)}
     </div>`).join('');

  rest.innerHTML = block('not scored yet', undecided, false) +
                   block('ignored', ignored, true);
  wire(rest);

  const n = Math.max(...owned.map(m => series[m].length), 0);
  note.className = 'n';
  note.textContent = owned.length
    ? (n >= 14 ? `${n} days of data.` : `${n} days in. Scores start at 14.`)
    : 'Nothing scored yet. Say what better means below.';
}

db.auth.getSession().then(({ data }) => {
  if (!data.session) { location.href = 'index.html'; return; }
  render();
});
</script>
