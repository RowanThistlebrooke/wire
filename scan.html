<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the scan</title>
<style>
  body { background:#0e1113; color:#e8e4dc; font:16px/1.5 system-ui; margin:0;
         padding:24px; max-width:640px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase;
       color:#69737a; margin:26px 0 10px; font-weight:600; }
  .n { color:#69737a; font-size:13px; margin:0 0 18px; }
  select { font:inherit; padding:12px; border-radius:8px; border:1px solid #252d33;
           background:#151a1d; color:#e8e4dc; width:100%; margin-bottom:20px; }
  .head { display:flex; gap:26px; flex-wrap:wrap; padding-bottom:16px;
          border-bottom:1px solid #1b2227; margin-bottom:14px; }
  .stat { display:flex; flex-direction:column; gap:3px; }
  .stat b { font:700 20px/1 system-ui; font-variant-numeric:tabular-nums; }
  .stat span { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#69737a; }
  .lead b { color:#d9a441; }
  .r { display:grid; grid-template-columns:130px 1fr 62px; gap:12px;
       align-items:center; padding:5px 0; }
  .r .m { font:12px/1.3 ui-monospace,Menlo,monospace; color:#69737a;
          text-align:right; overflow:hidden; text-overflow:ellipsis; }
  .r.hit .m { color:#e8e4dc; font-weight:700; }
  .r .v { font:700 12px/1 ui-monospace,Menlo,monospace; }
  .track { position:relative; height:22px; }
  .zero { position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:#252d33; }
  .thr { position:absolute; top:0; bottom:0; width:1px; background:#39434a; }
  .fill { position:absolute; top:3px; height:16px; border-radius:3px; }
  .scale { display:grid; grid-template-columns:130px 1fr 62px; gap:12px;
           margin-top:12px; padding-top:10px; border-top:1px solid #1b2227; }
  .scale div:nth-child(2) { display:flex; justify-content:space-between;
                            font-size:10px; color:#69737a; }
  .note { color:#9ba4aa; font-size:13px; margin:18px 0 0; }
  .foot { margin-top:28px; display:flex; gap:16px; flex-wrap:wrap; }
  a { color:#69737a; font-size:13px; }
  .err { color:#d1584a; font-size:13px; }
</style>

<h1>the scan</h1>
<p class="n">One commit against every stock you own, at a higher bar. These are leads, not findings.</p>

<select id="c"></select>
<div id="out"></div>

<div class="foot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="nav.js" defer></script>
<script src="you-reader.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
let COMMITS = [], SERIES = {};

// ---- the scan: one commit against everything ----
//
// The declared test asks one question at the ordinary bar, and its answer
// is a finding. The scan asks every question you own at once, and its
// answers are only leads.
//
// The bar has to go up. Check fifteen stocks at two standard errors and
// roughly one of them clears it by pure chance. At 3.3 the chance of any
// single false alarm across a normal ledger drops to about one in twenty,
// which is the same protection the declared test had to begin with.
const SCAN_BAR = 3.3;

function scanCommit(seriesByMetric, commit, commits, todayStr) {
  const rows = [];
  for (const metric of Object.keys(seriesByMetric)) {
    const r = testCommit(seriesByMetric[metric], commit, commits, todayStr);
    if (r.effect === undefined) { rows.push({ metric, ...r, lead: false }); continue; }
    const se = r.bar / 2;                       // bar was 2 standard errors
    const raised = Math.round(SCAN_BAR * se * 10) / 10;
    // A stock that never varies has a bar of zero, and zero clears zero.
    // No movement is not a lead.
    const lead = r.verdict !== 'early' && raised > 0 &&
                 Math.abs(r.effect) > 0 && Math.abs(r.effect) >= raised;
    rows.push({ metric, ...r, raised, lead });
  }
  return rows.sort((a, b) => Math.abs(b.effect || 0) - Math.abs(a.effect || 0));
}

function show() {
  const commit = COMMITS.find(x => x.id === c.value);
  if (!commit) { out.innerHTML = ''; return; }

  const today = new Date().toISOString().slice(0, 10);
  const withYou = { ...SERIES, YOU: etfSeries(SERIES, Object.keys(SERIES)) };
  const rows = scanCommit(withYou, commit, COMMITS, today);
  const usable = rows.filter(r => r.effect !== undefined);
  const leads = usable.filter(r => r.lead);

  if (!usable.length) {
    out.innerHTML = `<p class="err">Nothing to compare. ${rows[0] ? rows[0].why : ''}</p>`;
    return;
  }

  const max = Math.max(...usable.map(r => Math.abs(r.effect)),
                       ...usable.map(r => r.raised)) * 1.1;
  const bars = usable.map(r => {
    const w = Math.abs(r.effect) / max * 50;
    const left = r.effect > 0 ? 50 : 50 - w;
    const t = r.raised / max * 50;
    const col = r.lead ? (r.effect > 0 ? '#4bb5a6' : '#d1584a') : '#39434a';
    return `<div class="r ${r.lead ? 'hit' : ''}">
      <div class="m">${r.metric}</div>
      <div class="track">
        <div class="zero"></div>
        <div class="thr" style="left:${50 - t}%"></div>
        <div class="thr" style="left:${50 + t}%"></div>
        <div class="fill" style="left:${left}%;width:${w}%;background:${col};
             opacity:${r.lead ? 1 : .55}"></div>
      </div>
      <div class="v" style="color:${col}">${r.effect > 0 ? '+' : ''}${r.effect}</div>
    </div>`;
  }).join('');

  out.innerHTML = `
    <div class="head">
      <div class="stat lead"><b>${leads.length}</b><span>leads</span></div>
      <div class="stat"><b>${usable.length}</b><span>stocks tested</span></div>
      <div class="stat"><b>0</b><span>findings</span></div>
    </div>
    ${bars}
    <div class="scale"><div></div>
      <div><span>worse</span><span>the raised bar</span><span>better</span></div>
      <div></div></div>
    <p class="note">Zero findings, always. A scan cannot produce one.
      You did not ask these questions in advance, you asked all of them at once,
      so anything that clears the bar is only worth declaring next time.
      ${COMMITS.length > 1 ? 'Other commits were also running, which no bar can fix.' : ''}</p>`;
}

(async () => {
  const { data: s } = await db.auth.getSession();
  if (!s.session) { location.href = 'index.html'; return; }

  const [all, rules, commits] = await Promise.all(
    [readMetrics(db), readRules(db), readCommits(db)]);
  const rows = await readDays(db, all);

  COMMITS = commits;
  SERIES = rankSeries(rows, rules);

  if (!COMMITS.length) {
    out.innerHTML = '<p class="err">No commits yet.</p>';
    return;
  }
  c.innerHTML = COMMITS.map(x => `<option value="${x.id}">${x.name}</option>`).join('');
  c.onchange = show;
  show();
})();
</script>
