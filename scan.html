<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap">
<style>
/* one commit against everything you own, at the raised bar. leads, never findings. */
:root{--ground:#070809;--edge:#171c20;--edge2:#232a30;--ink:#e6e3dc;--dim:#8d959a;--muted:#5c656b;
 --teal:#c9a25a;--amber:#c9a25a;--leak:#c9695c;
 --ui:"Manrope","Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font:600 14px/1.5 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:var(--mono)}
button:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
a{color:inherit;text-decoration:none}

.main{max-width:820px;margin:0 auto;padding:22px 24px 110px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:0}
.out{background:none;border:0;color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0}
.out:hover{color:var(--ink)}
.lab{font:600 9.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* which commit */
.picks{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px}
.picks button{background:none;border:1px solid var(--edge2);color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:9px 11px;cursor:pointer}
.picks button:hover{color:var(--ink)}
.picks button.on{color:var(--ink);border-color:var(--ink)}

/* the counts */
.head{display:flex;gap:34px;flex-wrap:wrap;margin-top:30px;padding-bottom:16px;border-bottom:1px solid var(--edge)}
.stat b{display:block;font:500 34px/1 var(--ui)}
.stat.lead b{color:var(--amber)}
.stat span{display:block;margin-top:6px;font:600 9.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* one row per metric */
.r{display:grid;grid-template-columns:140px minmax(0,1fr) 150px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--edge)}
.r .m{font:600 13px/1.3 var(--ui);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.hit .m{color:var(--ink)}
.track{position:relative;height:18px}
.zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--edge2)}
.thr{position:absolute;top:4px;bottom:4px;width:1px;background:var(--amber);opacity:.7}
.fill{position:absolute;top:7px;height:4px;background:var(--dim);opacity:.6}
.r.hit .fill{opacity:1}
.r .v{text-align:right}
.r .v b{display:block;font:500 20px/1 var(--ui);color:var(--dim)}
.r .v b.up{color:var(--teal)}.r .v b.down{color:var(--leak)}
.r .v span{display:block;font:600 10px/1.5 var(--mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.r .v span.lead{color:var(--amber)}
.scale{display:grid;grid-template-columns:140px minmax(0,1fr) 150px;gap:16px;margin-top:10px}
.scale div:nth-child(2){display:flex;justify-content:space-between;font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.empty{font:600 11px/1.6 var(--mono);color:var(--muted);padding:24px 0;letter-spacing:.04em}
.empty a{color:var(--teal)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:4px;background:var(--ground);border-top:1px solid var(--edge);padding:0 24px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:block;border-top:1px solid transparent;color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:13px 12px 14px;white-space:nowrap}
.tabs a:hover{color:var(--dim)}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--teal)}
@media (max-width:640px){.main{padding:18px 16px 110px}.r,.scale{grid-template-columns:90px minmax(0,1fr) 110px;gap:10px}.r .v b{font-size:17px}}
</style>

<div class="main">
  <div class="bar">
    <p class="eyebrow">scan &#183; one commit &#215; everything &#183; bar 3.3 se</p>
    <button class="out" id="out" type="button">sign out</button>
  </div>

  <div class="picks" id="picks"></div>
  <div id="res"></div>
</div>

<nav class="tabs" aria-label="pages">
  <a href="you.html">you</a>
  <a href="pad.html">pad</a>
  <a href="import.html">import</a>
  <a href="commit.html">commit</a>
  <a href="test.html">test</a>
  <a href="scan.html" aria-current="page">scan</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/api/config.js"></script>
<script src="you-reader.js"></script>
<script>
const db = supabase.createClient(WIRE.url, WIRE.key);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sgn = v => (v >= 0 ? '+' : '') + (Math.round(v * 10) / 10);
let COMMITS = [], SERIES = {}, PICK = null, TODAY = null, STALEBY = staleBounds({});   // TODAY the ledger's day now, from day_of through readDay, set before anything draws

// the scan itself, scanCommit and its raised bar, lives in you-reader.js

// under every number, how much to trust it
function trust(r) {
  if (r.lead) return ['lead', 'lead'];
  if (r.verdict === 'early') return [`very unconfident · ${r.needs} more days`, ''];
  if (scanLead(r).unconfident) return ['unconfident', ''];
  return ['very unconfident', ''];
}

function drawPicks() {
  const box = document.getElementById('picks');
  box.innerHTML = COMMITS.map(c => `<button type="button" data-id="${esc(c.id)}" class="${PICK && PICK.id === c.id ? 'on' : ''}">${esc(c.name)}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => { PICK = COMMITS.find(c => c.id === b.dataset.id); drawPicks(); show(); });
}

function show() {
  const out = document.getElementById('res');
  if (!PICK) { out.innerHTML = ''; return; }

  const withYou = { YOU: etfSeries(SERIES, Object.keys(SERIES), STALEBY), ...SERIES };
  const rows = scanCommit(withYou, PICK, COMMITS, TODAY);
  const usable = rows.filter(r => r.effect !== undefined);
  const leads = usable.filter(r => r.lead);
  // a stock the gate gives no index cannot be scanned: named, with its reason on hover, never dropped in silence
  const gated = rows.filter(r => r.verdict === 'no index');
  const left = gated.length ? `<p class="empty">no index &#183; ${gated.map(r => `<span title="${esc(r.why)}">${esc(r.metric)}</span>`).join(' &#183; ')}</p>` : '';

  if (!usable.length) {
    out.innerHTML = `<p class="empty">${esc(PICK.name)} &#183; ${rows[0] ? esc(rows[0].why) : '0 readings'}</p>` + left;
    return;
  }

  const max = Math.max(...usable.map(r => Math.abs(r.effect)), ...usable.map(r => r.raised)) * 1.1;
  const bars = usable.map(r => {
    const w = Math.abs(r.effect) / max * 50;
    const left = r.effect > 0 ? 50 : 50 - w;
    const t = r.raised / max * 50;
    const [word, cls] = trust(r);
    const vcls = r.lead ? (r.effect > 0 ? 'up' : 'down') : '';
    return `<div class="r ${r.lead ? 'hit' : ''}">
      <div class="m">${esc(r.metric)}</div>
      <div class="track">
        <div class="zero"></div>
        <div class="thr" style="left:${(50 - t).toFixed(2)}%"></div>
        <div class="thr" style="left:${(50 + t).toFixed(2)}%"></div>
        <div class="fill" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%${r.lead ? `;background:${r.effect > 0 ? 'var(--teal)' : 'var(--leak)'}` : ''}"></div>
      </div>
      <div class="v"><b class="${vcls}">${sgn(r.effect)}</b><span class="${cls}">${word}</span></div>
    </div>`;
  }).join('');

  out.innerHTML = `
    <div class="head">
      <div class="stat lead"><b>${leads.length}</b><span>leads</span></div>
      <div class="stat"><b>${usable.length}</b><span>tested</span></div>
      <div class="stat"><b>0</b><span>findings</span></div>
      <div class="stat"><b>${PICK.days}</b><span>days &#183; ${PICK.from} &#8594; ${PICK.to || 'today'}</span></div>
    </div>
    ${bars}
    <div class="scale"><div></div><div><span>worse</span><span>the raised bar</span><span>better</span></div><div></div></div>`;
}

document.getElementById('out').onclick = async () => { await db.auth.signOut(); location.href = 'index.html'; };

(async () => {
  const { data: s } = await db.auth.getSession();
  if (!s.session) { location.href = 'index.html'; return; }

  const [today, all, rules, voids, cvoids, starts, sources] = await Promise.all([readDay(db), readMetrics(db), readRules(db), readVoids(db), readCommitVoids(db), readStarts(db), readSources(db)]);
  const [commits, rows] = await Promise.all([readCommits(db, today), readDays(db, all)]);

  TODAY = today;
  COMMITS = liveCommits(commits, cvoids);   // a voided commit is in no scan
  SERIES = rankSeries(rows, rules, voids, starts);
  STALEBY = staleBounds(sources);

  if (!COMMITS.length) { document.getElementById('res').innerHTML = `<p class="empty">0 commits &#183; <a href="commit.html">log one</a></p>`; return; }
  PICK = COMMITS[0];
  drawPicks(); show();
})();
</script>
